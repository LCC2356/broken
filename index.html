<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO - 深度故障版</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #050505; color: #eee; 
            font-family: 'Inter', system-ui, sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            user-select: none;
        }
        .toolbar { 
            background-color: #111; padding: 12px 20px; display: flex; gap: 15px; 
            align-items: center; border-bottom: 1px solid #333; z-index: 10; flex-wrap: wrap;
        }
        .branding { font-weight: 900; color: #fff; font-size: 14px; border-right: 1px solid #333; padding-right: 15px;}
        .control-group { 
            display: flex; align-items: center; gap: 8px; background: #1a1a1a; 
            padding: 4px 10px; border-radius: 4px; border: 1px solid #222;
        }
        .control-group label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px;}
        .control-group span { font-size: 11px; color: #00ff00; width: 30px; text-align: right; font-family: monospace;}
        input[type="range"] { cursor: pointer; width: 70px; accent-color: #00ff00; }
        button { 
            background-color: #222; border: 1px solid #444; color: #fff; 
            padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 11px; transition: 0.2s; 
        }
        button:hover { background-color: #333; border-color: #00ff00; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; overflow: auto; padding: 20px; }
        canvas { background-color: #000; cursor: crosshair; box-shadow: 0 0 100px rgba(0,255,0,0.05); }
        .status-bar { background-color: #000; padding: 5px 20px; font-size: 10px; color: #555; display: flex; justify-content: space-between; border-top: 1px solid #111;}
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE ENGINE v2.0</div>
        
        <div class="control-group">
            <label>故障线宽</label>
            <input type="range" id="ctrlLineWidth" min="1" max="15" value="2">
            <span id="valLineWidth">2</span>
        </div>

        <div class="control-group">
            <label>故障密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" value="85">
            <span id="valDensity">85</span>
        </div>

        <div class="control-group">
            <label>随机噪声</label>
            <input type="range" id="ctrlJitter" min="0" max="100" value="40">
            <span id="valJitter">40</span>
        </div>
        
        <button id="btnRandom">随机冲击</button>
        <button id="btnClear" style="color:#ff4444">重置画布</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas" width="2000" height="400"></canvas>
    </div>

    <div class="status-bar">
        <span>MODE: LCD_PHYSICAL_DAMAGE_SIMULATION</span>
        <span>IMPACT_POINTS: <span id="strikeCount" style="color:#00ff00">0</span></span>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const strikeCountDisplay = document.getElementById('strikeCount');
        
        let state = {
            density: 0.85,
            lineWidth: 2,
            jitter: 0.4,
            strikes: [] 
        };

        // UI 绑定
        document.getElementById('ctrlDensity').oninput = e => {
            state.density = e.target.value / 100;
            document.getElementById('valDensity').innerText = e.target.value;
        };
        document.getElementById('ctrlLineWidth').oninput = e => {
            state.lineWidth = parseInt(e.target.value);
            document.getElementById('valLineWidth').innerText = e.target.value;
        };
        document.getElementById('ctrlJitter').oninput = e => {
            state.jitter = e.target.value / 100;
            document.getElementById('valJitter').innerText = e.target.value;
        };

        function generatePhysicalShards(originX, originY) {
            const shards = [];
            // 锁定放射角度，减少水平偏移，增强“纵向切割”感
            const rayCount = Math.floor(Math.random() * 8) + 12;
            
            // 环半径设计：快速覆盖纵向高度，水平跨度限制在画布 1/10
            const maxH = canvas.height;
            const rings = [0, maxH*0.05, maxH*0.15, maxH*0.4, maxH*0.8, maxH*1.5];

            const angles = [];
            for(let i=0; i<rayCount; i++) {
                // 角度扰动减小，使裂纹更笔直
                angles.push((Math.PI * 2 / rayCount) * i + (Math.random() * 0.2 - 0.1));
            }
            angles.sort();

            const vertices = [];
            for (let r = 0; r < rings.length; r++) {
                const ringVertices = [];
                for (let a = 0; a < rayCount; a++) {
                    const radius = rings[r];
                    // 核心修改：将 X 轴压缩，Y 轴拉伸，形成 1:10 的破裂比例
                    const stretchX = 0.4; 
                    const stretchY = 1.2;
                    ringVertices.push({
                        x: originX + Math.cos(angles[a]) * radius * stretchX,
                        y: originY + Math.sin(angles[a]) * radius * stretchY
                    });
                }
                vertices.push(ringVertices);
            }

            for (let r = 0; r < rings.length - 1; r++) {
                for (let a = 0; a < rayCount; a++) {
                    const nextA = (a + 1) % rayCount;
                    const poly = [vertices[r][a], vertices[r+1][a], vertices[r+1][nextA], vertices[r][nextA]];
                    
                    let type = 'none';
                    const rand = Math.random();
                    
                    // 修改：中心区域（r <= 1）现在也有概率产生故障线
                    if (r === 0) {
                        type = rand > 0.5 ? 'glitchLines' : 'black';
                    } else if (r <= 2) {
                        type = rand > 0.2 ? 'glitchLines' : 'black';
                    } else {
                        type = rand > 0.4 ? 'glitchLines' : 'none';
                    }

                    shards.push({ polygon: poly, type: type, ringIndex: r });
                }
            }
            return { x: originX, y: originY, shards };
        }

        function drawGlitchLines(shard) {
            let minX = Infinity, maxX = -Infinity;
            shard.polygon.forEach(p => {
                if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
            });

            const colors = ['#FF0000', '#00FF00', '#0000FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00'];
            const w = state.lineWidth;
            
            for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += w) {
                // 结合 Density 和 Jitter 控制分布
                if (Math.random() < state.density) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    // Jitter 影响 X 轴偏移
                    const xOffset = (Math.random() - 0.5) * (state.jitter * 50);
                    ctx.fillRect(x + xOffset, 0, w, canvas.height); 
                }
            }
        }

        function render() {
            // 背景设为极深灰模拟黑屏，非纯绿
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            state.strikes.forEach(strike => {
                strike.shards.forEach(shard => {
                    if (shard.type === 'none') return;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    ctx.closePath();
                    ctx.clip(); 

                    if (shard.type === 'black') {
                        ctx.fillStyle = '#000';
                        ctx.fill();
                    } else if (shard.type === 'glitchLines') {
                        // 底色深黑
                        ctx.fillStyle = '#000';
                        ctx.fill();
                        drawGlitchLines(shard);
                    }
                    
                    // 中心高亮增强（参考图中的中心白光感）
                    if (shard.ringIndex === 0) {
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.fill();
                    }
                    
                    ctx.restore();
                });

                // 绘制极细的白色裂纹线条
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 0.5;
                strike.shards.forEach(shard => {
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    ctx.closePath();
                    ctx.stroke();
                });
            });

            requestAnimationFrame(render);
        }

        function addStrike(x, y) {
            state.strikes.push(generatePhysicalShards(x, y));
            strikeCountDisplay.innerText = state.strikes.length;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            addStrike(x, y);
        });

        document.getElementById('btnRandom').onclick = () => {
            addStrike(Math.random() * canvas.width, Math.random() * canvas.height);
        };

        document.getElementById('btnClear').onclick = () => {
            state.strikes = [];
            strikeCountDisplay.innerText = 0;
        };

        // 初始化
        render();
    </script>
</body>
</html>
