<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO - 深度几何蜘蛛网定制版</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #111; color: #eee; 
            font-family: 'Inter', system-ui, sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            user-select: none;
        }
        .toolbar { 
            background-color: #222; padding: 10px 20px; display: flex; gap: 15px; 
            align-items: center; border-bottom: 1px solid #000; z-index: 10;
        }
        .branding { font-weight: 900; color: #fff; font-size: 14px; margin-right: 10px; letter-spacing: 1px;}
        .control-group { 
            display: flex; align-items: center; gap: 8px; background: #1a1a1a; 
            padding: 5px 10px; border-radius: 4px; border: 1px solid #333;
        }
        .control-group label { font-size: 11px; color: #888; text-transform: uppercase;}
        .control-group span { font-size: 11px; color: #74ff06; width: 30px; text-align: right; font-family: monospace;}
        input[type="range"] { cursor: pointer; width: 70px; accent-color: #74ff06; }
        button { 
            background-color: #333; border: 1px solid #555; color: #fff; 
            padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: bold;
        }
        button:hover { background-color: #444; border-color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #050505; padding: 20px; overflow: auto;}
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; }
        .status-bar { background-color: #111; padding: 5px 20px; font-size: 10px; color: #555; display: flex; justify-content: space-between;}
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE PRO</div>
        
        <div class="control-group">
            <label>线宽</label>
            <input type="range" id="ctrlLineWidth" min="1" max="10" value="2">
            <span id="valLineWidth">2</span>
        </div>

        <div class="control-group">
            <label>故障密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" value="85">
            <span id="valDensity">85</span>
        </div>

        <div class="control-group">
            <label>随机抖动</label>
            <input type="range" id="ctrlJitter" min="0" max="100" value="40">
            <span id="valJitter">40</span>
        </div>

        <div class="control-group">
            <label>几何扭曲</label>
            <input type="range" id="ctrlDistortion" min="0" max="100" value="50">
            <span id="valDistortion">50</span>
        </div>
        
        <button id="btnClear" style="color:#ff5555">RESET</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas" width="2000" height="100"></canvas>
    </div>

    <div class="status-bar">
        <span>MODE: SHATTERED_WEB_WITH_DEPTH | CANVAS: 2000 x 100</span>
        <span>STRIKES: <span id="strikeCount" style="color:#74ff06">0</span> | BG: #74FF06</span>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const strikeCountDisplay = document.getElementById('strikeCount');
        
        let state = {
            density: 0.85,
            lineWidth: 2,
            jitter: 0.4,
            distortion: 0.5,
            strikes: [] 
        };

        // UI 绑定
        document.getElementById('ctrlDensity').oninput = e => {
            state.density = e.target.value / 100;
            document.getElementById('valDensity').innerText = e.target.value;
        };
        document.getElementById('ctrlLineWidth').oninput = e => {
            state.lineWidth = parseInt(e.target.value);
            document.getElementById('valLineWidth').innerText = e.target.value;
        };
        document.getElementById('ctrlJitter').oninput = e => {
            state.jitter = e.target.value / 100;
            document.getElementById('valJitter').innerText = e.target.value;
        };
        document.getElementById('ctrlDistortion').oninput = e => {
            state.distortion = e.target.value / 100;
            document.getElementById('valDistortion').innerText = e.target.value;
        };
        document.getElementById('btnClear').onclick = () => {
            state.strikes = [];
            strikeCountDisplay.innerText = 0;
        };

        function generatePhysicalShards(originX, originY) {
            const shards = [];
            const rayCount = Math.floor(Math.random() * 6) + 16;
            const maxH = canvas.height;
            // 具有深度和贯穿能力的环
            const rings = [0, 8, 25, 60, 150, 400, 800];

            const angles = [];
            for(let i=0; i<rayCount; i++) {
                angles.push((Math.PI * 2 / rayCount) * i + (Math.random() * 0.3 - 0.15));
            }
            angles.sort();

            const vertices = [];
            for (let r = 0; r < rings.length; r++) {
                const ringVertices = [];
                for (let a = 0; a < rayCount; a++) {
                    const radius = rings[r];
                    // 几何扭曲实现：
                    // 使用 distortion 值和 jitter 值来扭曲顶点。
                    const angleJitter = (Math.random() - 0.5) * (state.jitter * 0.2); // 角度抖动
                    const finalAngle = angles[a] + angleJitter;
                    
                    // X/Y 轴的偏心和扭曲：模拟 image_4.png 的形状
                    // 我们使用一个特定的偏心拉伸因子，例如 y 轴拉伸，x 轴压缩
                    const distortionFactorY = 1 + (state.distortion * 0.3); // 垂直拉伸
                    const distortionFactorX = 1 - (state.distortion * 0.2); // 水平压缩
                    
                    // 为了增加深度和透视，我们将外部环设置得更远，且拉伸更强。
                    const finalDistFactorY = distortionFactorY * (1 + (r / rings.length)); // 随深度增加
                    const finalDistFactorX = distortionFactorX * (1 - (r / (rings.length * 2))); // 随深度减少，模拟透视
                    
                    ringVertices.push({
                        x: originX + Math.cos(finalAngle) * radius * finalDistFactorX,
                        y: originY + Math.sin(finalAngle) * radius * finalDistFactorY
                    });
                }
                vertices.push(ringVertices);
            }

            for (let r = 0; r < rings.length - 1; r++) {
                for (let a = 0; a < rayCount; a++) {
                    const nextA = (a + 1) % rayCount;
                    const poly = [vertices[r][a], vertices[r+1][a], vertices[r+1][nextA], vertices[r][nextA]];
                    
                    let type = 'none';
                    const rand = Math.random();
                    // 故障类型分配
                    if (r <= 2) type = rand > 0.35 ? 'glitchLines' : 'black'; // 中心：主要是故障线条
                    else if (r === 3) type = rand > 0.25 ? 'glitchLines' : 'black';
                    else type = rand > 0.7 ? 'glitchLines' : 'none'; // 外部：偶尔故障线条

                    shards.push({ polygon: poly, type: type, ringIndex: r });
                }
            }
            return { x: originX, y: originY, shards: shards };
        }

        function drawVerticalGlitch(shard) {
            let minX = Infinity, maxX = -Infinity;
            shard.polygon.forEach(p => { if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x; });

            const colors = ['#FF0033', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
            const w = state.lineWidth;
            
            for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += w) {
                if (Math.random() < state.density) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    const xOffset = (Math.random() - 0.5) * (state.jitter * 40);
                    // 故障线条始终填满画板高度 (100px)
                    ctx.fillRect(x + xOffset, 0, w, canvas.height); 
                }
            }
        }

        function render() {
            // 背景色填充为 #74ff06
            ctx.fillStyle = '#74ff06';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            state.strikes.forEach(strike => {
                strike.shards.forEach(shard => {
                    if (shard.type === 'none') return;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    ctx.closePath();
                    ctx.clip(); 

                    if (shard.type === 'black') {
                        ctx.fillStyle = '#000';
                        ctx.fill();
                    } else if (shard.type === 'glitchLines') {
                        // 故障区域底色深黑，解决中心不故障问题
                        ctx.fillStyle = '#000';
                        ctx.fill();
                        drawVerticalGlitch(shard);
                    }
                    
                    // 撞击点核心白光增强
                    if (shard.ringIndex === 0) {
                        ctx.fillStyle = 'rgba(255,255,255,0.4)';
                        ctx.fill();
                    }
                    
                    ctx.restore();
                });

                // 绘制细裂纹线条
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 0.5;
                strike.shards.forEach(shard => {
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    ctx.closePath();
                    ctx.stroke();
                });
            });

            requestAnimationFrame(render);
        }

        function addStrike(x, y) {
            state.strikes.push(generatePhysicalShards(x, y));
            strikeCountDisplay.innerText = state.strikes.length;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            addStrike(x, y);
        });

        // 初始化
        render();
    </script>
</body>
</html>
