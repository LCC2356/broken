<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO v7.4 - 边缘光泽深度版</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #111; color: #eee; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { background-color: #222; padding: 10px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #000; z-index: 10; flex-wrap: wrap; }
        .branding { font-weight: 900; font-size: 14px; color: #fff; margin-right: 10px; letter-spacing: 1px; border-right: 1px solid #444; padding-right: 15px;}
        .control-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; border: 1px solid #333; }
        .control-group label { font-size: 10px; color: #888; text-transform: uppercase; }
        .control-group span { font-size: 10px; color: #74ff06; width: 25px; text-align: right; font-family: monospace; }
        input[type="range"] { cursor: pointer; width: 60px; accent-color: #74ff06; }
        
        .switch-group { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #888; text-transform: uppercase; margin-left: 10px;}
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 18px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #74ff06; }
        input:checked + .slider:before { transform: translateX(16px); }

        button { background: #333; border: 1px solid #555; color: #fff; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: bold; }
        button:hover { border-color: #74ff06; color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #050505; padding: 20px; }
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE_v7.4</div>
        <div class="control-group">
            <label>线宽</label>
            <input type="range" id="ctrlLineWidth" min="0" max="15" value="2">
            <span id="valLineWidth">2</span>
        </div>
        <div class="control-group">
            <label>密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" value="70">
            <span id="valDensity">70</span>
        </div>
        <div class="switch-group">
            <label>原位闪烁</label>
            <label class="switch">
                <input type="checkbox" id="ctrlDynamic" checked>
                <span class="slider"></span>
            </label>
        </div>
        <button id="btnClear" style="margin-left: auto;">REBOOT</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas" width="2000" height="100"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const EPSILON = 0.01;
        
        let state = {
            density: 0.7,
            lineWidth: 2,
            isDynamic: true,
            maxDepth: 3, 
            polygons: [] 
        };

        // UI 绑定
        document.getElementById('ctrlDensity').oninput = e => { state.density = e.target.value / 100; document.getElementById('valDensity').innerText = e.target.value; };
        document.getElementById('ctrlLineWidth').oninput = e => { state.lineWidth = parseInt(e.target.value); document.getElementById('valLineWidth').innerText = e.target.value; };
        document.getElementById('ctrlDynamic').onchange = e => { state.isDynamic = e.target.checked; };
        document.getElementById('btnClear').onclick = init;

        class Polygon {
            constructor(points, type = 'base', seed = null, depth = 0) {
                this.points = points; 
                this.type = type; 
                this.seed = seed !== null ? seed : Math.random();
                this.depth = depth; 
            }

            getArea() {
                let area = 0;
                for (let i = 0; i < this.points.length; i++) {
                    let j = (i + 1) % this.points.length;
                    area += this.points[i][0] * this.points[j][1] - this.points[j][0] * this.points[i][1];
                }
                return Math.abs(area) / 2;
            }

            draw() {
                if (this.points.length < 3) return;
                ctx.save();
                
                // 1. 定义多边形路径，用于填充和裁剪
                ctx.beginPath();
                ctx.moveTo(this.points[0][0], this.points[0][1]);
                for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i][0], this.points[i][1]);
                ctx.closePath();

                // --- LAYER 1: 底色与故障线 ---
                if (this.type === 'base') {
                    ctx.fillStyle = '#74ff06'; ctx.fill();
                } else {
                    ctx.fillStyle = '#000'; ctx.fill();
                    if (this.type === 'glitch' && state.lineWidth > 0) {
                        ctx.save(); // 为 Glitch 闪烁区域创建独立的 clip
                        ctx.clip();
                        this.drawGlitchLines();
                        ctx.restore();
                    }
                }
                ctx.restore(); // 还原底色与故障线层

                // --- LAYER 2: 💎 边缘向内的白色渐变 (Inner Shadow 技巧) ---
                ctx.save();
                // 同样定义路径并裁剪，确保渐变只出现在碎片内部
                ctx.beginPath();
                ctx.moveTo(this.points[0][0], this.points[0][1]);
                for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i][0], this.points[i][1]);
                ctx.closePath();
                ctx.clip();

                // 设置阴影属性：白色，30% 不透明度
                ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
                // 模糊值定义渐变的深度，在100px画板上，20px显得边缘厚重
                ctx.shadowBlur = 20; 
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // 核心：绘制反转路径。填充外部区域，让阴影向内投射。
                // 1. 先绕 Canvas 边界画一个逆时针的大矩形框
                ctx.beginPath();
                ctx.moveTo(-100, -100);
                ctx.lineTo(-100, canvas.height + 100);
                ctx.lineTo(canvas.width + 100, canvas.height + 100);
                ctx.lineTo(canvas.width + 100, -100);
                ctx.closePath();

                // 2. 然后绕多边形点顺时针画一个洞（利用 non-zero winding rule 实现 XOR 效果）
                // 假设 points 是逆时针的，反向 loop 就能得到顺时针路径
                ctx.moveTo(this.points[0][0], this.points[0][1]);
                for (let i = this.points.length - 1; i >= 0; i--) {
                    ctx.lineTo(this.points[i][0], this.points[i][1]);
                }
                ctx.closePath();

                // 填充反转后的 shape（颜色不重要，因为它在碎片外部，被 clipped 掉了，只留下了向内的阴影）
                ctx.fillStyle = "black";
                ctx.fill();

                ctx.restore(); // 还原渐变层

                // --- LAYER 3: 物理裂缝线 (原有的细圈边) ---
                if (this.type !== 'base') {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(this.points[0][0], this.points[0][1]);
                    for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i][0], this.points[i][1]);
                    ctx.closePath();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                    ctx.restore();
                }
            }

            drawGlitchLines() {
                let minX = 2000, maxX = 0;
                this.points.forEach(p => { if(p[0] < minX) minX = p[0]; if(p[0] > maxX) maxX = p[0]; });
                const colors = ['#FF0033', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
                const w = Math.max(1, state.lineWidth);
                let prng = this.getPseudoRandom(this.seed);
                for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += w) {
                    const noise = this.absRandom(x, this.seed);
                    if (noise < state.density) {
                        if (state.isDynamic) {
                            const flicker = Math.random();
                            if (flicker < 0.1) continue;
                            if (flicker < 0.3) ctx.globalAlpha = 0.4;
                        }
                        ctx.fillStyle = colors[Math.floor(noise * colors.length * 13) % colors.length];
                        ctx.fillRect(x, 0, w, canvas.height); 
                        ctx.globalAlpha = 1.0;
                    }
                }
            }

            absRandom(x, s) {
                let val = Math.sin(x * 12.9898 + s * 78.233) * 43758.5453;
                return val - Math.floor(val);
            }
            getPseudoRandom(s) {
                let m_w = (123456789 + s * 10000) & 0xffffffff;
                let m_z = (987654321 - s * 10000) & 0xffffffff;
                return () => {
                    m_z = (36969 * (m_z & 65535) + (m_z >> 16)) & 0xffffffff;
                    m_w = (18000 * (m_w & 65535) + (m_w >> 16)) & 0xffffffff;
                    return (((m_z << 16) + m_w) & 0xffffffff) / 4294967296 + 0.5;
                }
            }
        }

        function generatePolyline(xBase, my, angleDeg) {
            const path = [];
            const segments = 3; 
            const h = canvas.height;
            const tanA = Math.tan(angleDeg * Math.PI / 180);
            for (let i = 0; i <= segments; i++) {
                const y = (h / segments) * i;
                const x = xBase + (y - my) * tanA + (Math.random() - 0.5) * 15;
                path.push([x, y]);
            }
            return path;
        }

        function sliceByPolyline(polyPoints, path) {
            let left = [], right = [];
            const getXAtY = (y) => {
                for (let i = 0; i < path.length - 1; i++) {
                    if (y >= path[i][1] && y <= path[i+1][1]) {
                        const t = (y - path[i][1]) / (path[i+1][1] - path[i][1]);
                        return path[i][0] + t * (path[i+1][0] - path[i][0]);
                    }
                }
                return path[0][0];
            };
            const getSide = (p) => p[0] - getXAtY(p[1]);
            for (let i = 0; i < polyPoints.length; i++) {
                let p1 = polyPoints[i], p2 = polyPoints[(i + 1) % polyPoints.length];
                let s1 = getSide(p1), s2 = getSide(p2);
                if (s1 < 0) left.push(p1); else right.push(p1);
                if ((s1 < 0 && s2 >= 0) || (s1 >= 0 && s2 < 0)) {
                    let d = Math.abs(s1) + Math.abs(s2);
                    let t = d < 0.001 ? 0.5 : Math.abs(s1) / d;
                    let iy = p1[1] + (p2[1] - p1[1]) * t;
                    let ix = getXAtY(iy);
                    left.push([ix, iy]); right.push([ix, iy]);
                }
            }
            return [left, right];
        }

        function init() {
            state.polygons = [new Polygon([[0, 0], [canvas.width, 0], [canvas.width, canvas.height], [0, canvas.height]], 'base', null, 0)];
        }

        function isPointInPoly(pt, poly) {
            let x = pt[0], y = pt[1], inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                if (((poly[i][1] > y) != (poly[j][1] > y)) && (x < (poly[j][0] - poly[i][0]) * (y - poly[i][1]) / (poly[j][1] - poly[i][1]) + poly[i][0])) inside = !inside;
            }
            return inside;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (state.polygons.length > 600) return;

            const angL = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 15);
            const angR = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 15);
            const xL = mx - (30 + Math.random() * 50);
            const xR = mx + (30 + Math.random() * 50);

            const pathL = generatePolyline(xL, my, angL);
            const pathR = generatePolyline(xR, my, angR);

            for (let i = state.polygons.length - 1; i >= 0; i--) {
                const target = state.polygons[i];
                if (target.depth >= state.maxDepth) continue;
                
                if (isPointInPoly([mx, my], target.points)) {
                    let [p1, pRest] = sliceByPolyline(target.points, pathL);
                    if (p1.length > 2 && pRest.length > 2) {
                        let [centerQuad, p2] = sliceByPolyline(pRest, pathR);
                        if (centerQuad.length > 2) {
                            shatter(centerQuad, mx, my, target.seed, target.depth + 1);
                            state.polygons.splice(i, 1);
                            const getSeed = (s) => Math.random() < 0.5 ? s : Math.random();
                            state.polygons.push(new Polygon(p1, target.type, getSeed(target.seed), target.depth + 1));
                            state.polygons.push(new Polygon(p2, target.type, getSeed(target.seed), target.depth + 1));
                        } else shatter(target.points, mx, my, target.seed, target.depth + 1, i);
                    } else shatter(target.points, mx, my, target.seed, target.depth + 1, i);
                    break;
                }
            }
        });

        function shatter(points, mx, my, parentSeed, nextDepth, index = -1) {
            const newPolys = [];
            if (new Polygon(points).getArea() < 5) return;

            for (let i = 0; i < points.length; i++) {
                const p1 = points[i], p2 = points[(i + 1) % points.length];
                const r = 0.3 + Math.random() * 0.4;
                const mid = [p1[0] + (p2[0]-p1[0])*r, p1[1] + (p2[1]-p1[1])*r];
                const getSeed = (s) => Math.random() < 0.5 ? s : Math.random();
                newPolys.push(new Polygon([p1, mid, [mx, my]], Math.random() < 0.6 ? 'glitch' : 'black', getSeed(parentSeed), nextDepth));
                newPolys.push(new Polygon([mid, p2, [mx, my]], Math.random() < 0.3 ? 'glitch' : 'black', getSeed(parentSeed), nextDepth));
            }
            if (index !== -1) state.polygons.splice(index, 1, ...newPolys);
            else state.polygons.push(...newPolys);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            state.polygons.forEach(p => p.draw());
            requestAnimationFrame(render);
        }

        init(); render();
    </script>
</body>
</html>
