<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO v8.9 - 极致随机边缘版</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #080808; color: #eee; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { background-color: #111; padding: 10px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #333; z-index: 10; flex-wrap: wrap; }
        .branding { font-weight: 900; font-size: 14px; color: #74ff06; margin-right: 10px; letter-spacing: 1px; border-right: 1px solid #333; padding-right: 15px;}
        .control-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; border: 1px solid #333; }
        .control-group label { font-size: 10px; color: #888; text-transform: uppercase; white-space: nowrap; }
        .control-group span { font-size: 10px; color: #74ff06; width: 25px; text-align: right; font-family: monospace; }
        input[type="range"] { cursor: pointer; width: 50px; accent-color: #74ff06; }
        
        .switch-group { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #888; text-transform: uppercase; margin-left: 5px;}
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 18px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #74ff06; }
        input:checked + .slider:before { transform: translateX(16px); }

        button { background: #333; border: 1px solid #555; color: #fff; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: bold; }
        button:hover { border-color: #74ff06; color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #000; padding: 20px; }
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; width: 2000px; height: 100px; box-shadow: 0 0 50px rgba(116, 255, 6, 0.1); }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE_v8.9</div>
        <div class="control-group">
            <label>线宽</label>
            <input type="range" id="ctrlLineWidth" min="1" max="150" value="5">
            <span id="valLineWidth">0.5</span>
        </div>
        <div class="control-group">
            <label>密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" value="15">
            <span id="valDensity">15</span>
        </div>
        
        <div class="control-group" style="border-color: #0044FF;">
            <label>横向概率%</label>
            <input type="range" id="ctrlHorizProb" min="0" max="100" value="10">
            <span id="valHorizProb">10</span>
        </div>

        <div class="switch-group"><label>闪烁</label><label class="switch"><input type="checkbox" id="ctrlDynamic" checked><span class="slider"></span></label></div>
        <div class="switch-group"><label>裂纹</label><label class="switch"><input type="checkbox" id="ctrlCracks" checked><span class="slider"></span></label></div>
        <button id="btnClear" style="margin-left: auto;">REBOOT</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        const W = 2000, H = 100;
        const dpr = Math.max(window.devicePixelRatio || 1, 2); 
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.scale(dpr, dpr);

        let state = {
            density: 0.15, lineWidth: 0.5, horizProb: 0.10,
            isDynamic: true, isCracksEnabled: true,
            screenGlitch: 0, polygons: [], cracks: [],
            crackScale: 0.10, crackThickness: 0.2, blastScale: 0.05       
        };

        // UI 绑定
        document.getElementById('ctrlLineWidth').oninput = e => { state.lineWidth = e.target.value / 10; document.getElementById('valLineWidth').innerText = state.lineWidth.toFixed(1); };
        document.getElementById('ctrlDensity').oninput = e => { state.density = e.target.value / 100; document.getElementById('valDensity').innerText = e.target.value; };
        document.getElementById('ctrlHorizProb').oninput = e => { state.horizProb = e.target.value / 100; document.getElementById('valHorizProb').innerText = e.target.value; };
        document.getElementById('ctrlDynamic').onchange = e => { state.isDynamic = e.target.checked; };
        document.getElementById('ctrlCracks').onchange = e => { state.isCracksEnabled = e.target.checked; };
        document.getElementById('btnClear').onclick = init;

        // 核心：生成更“暴燥”的折线
        function generateWildPolyline(xBase, angleDeg) {
            const path = [];
            const segments = 80; // 极高频
            const tanA = Math.tan(angleDeg * Math.PI / 180);
            
            for (let i = 0; i <= segments; i++) {
                const y = (H / segments) * i;
                // 基础漂移 + 尖锐突刺
                let jitter = (Math.random() - 0.5) * 60;
                if (Math.random() > 0.85) jitter *= 2.5; // 偶尔巨大的撕裂
                
                const edgeConstraint = (i === 0 || i === segments) ? 0 : 1;
                const x = xBase + (y - (H/2)) * tanA + (jitter * edgeConstraint);
                path.push({x, y});
            }
            return path;
        }

        class Polygon {
            constructor(points, type = 'base') {
                this.points = points; this.type = type; this.seed = Math.random();
            }
            draw() {
                if (this.points.length < 3) return;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i].x, this.points[i].y);
                ctx.closePath();

                if (this.type === 'base') {
                    ctx.fillStyle = '#74ff06'; ctx.fill();
                } else {
                    ctx.fillStyle = '#000'; ctx.fill();
                    if (this.type === 'glitch') {
                        ctx.save(); ctx.clip(); this.drawGlitch(); ctx.restore();
                    }
                }
                ctx.restore();
            }
            drawGlitch() {
                const colors = ['#FF0033', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF'];
                const step = Math.max(1, state.lineWidth * 2);
                for (let x = 0; x < W; x += step) {
                    if (Math.random() < state.density) {
                        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                        ctx.fillRect(x, 0, state.lineWidth, H);
                    }
                }
            }
        }

        // 核心：重新设计的切割算法，确保边缘跟随折线点
        function sliceWildly(targetPoints, path, side) {
            // side: -1 为左, 1 为右
            let resultPoints = [];
            
            // 1. 先加入折线的所有点（确保边缘是折线）
            const jaggedEdge = side === -1 ? [...path] : [...path].reverse();
            resultPoints.push(...jaggedEdge);

            // 2. 加入原多边形在该侧的边界点
            // 简单化逻辑：对于垂直碎裂，我们取原多边形最左或最右的顶点
            const boundaryX = side === -1 ? 0 : W;
            if (side === -1) {
                resultPoints.push({x: 0, y: H}, {x: 0, y: 0});
            } else {
                resultPoints.push({x: W, y: 0}, {x: W, y: H});
            }

            return new Polygon(resultPoints, side === -1 ? 'base' : 'base');
        }

        function triggerImpact(cx, cy) {
            state.screenGlitch = 5;
            
            // 每次点击生成两个随机“断裂面”
            const xL = cx - (20 + Math.random() * 40);
            const xR = cx + (20 + Math.random() * 40);
            const pathL = generateWildPolyline(xL, (Math.random()-0.5)*30);
            const pathR = generateWildPolyline(xR, (Math.random()-0.5)*30);

            // 构造三个多边形：左、中(故障)、右
            // 左多边形
            const pLeft = new Polygon([
                ...pathL,
                {x: 0, y: H}, {x: 0, y: 0}
            ], 'base');

            // 右多边形
            const pRight = new Polygon([
                ...[...pathR].reverse(),
                {x: W, y: 0}, {x: W, y: H}
            ], 'base');

            // 中间故障区 (包含左右两条折线的点)
            const pMid = new Polygon([
                ...pathL,
                ...[...pathR].reverse()
            ], 'glitch');

            state.polygons = [pLeft, pRight, pMid];
        }

        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (W / rect.width);
            const my = (e.clientY - rect.top) * (H / rect.height);
            triggerImpact(mx, my);
        });

        function init() {
            state.polygons = [new Polygon([{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}], 'base')];
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            state.polygons.forEach(p => p.draw());
            
            if (state.screenGlitch > 0) {
                state.screenGlitch--;
                if (Math.random() > 0.8) {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(0,0,W,H);
                }
            }
            requestAnimationFrame(render);
        }

        init(); render();
    </script>
</body>
</html>
