<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>屏幕破碎实验室 - DELAUNAY 专业版</title>
    <script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #111; color: #eee; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            user-select: none;
        }
        
        /* 顶部控制台 */
        .toolbar { 
            background-color: #222; padding: 10px 20px; display: flex; gap: 15px; 
            align-items: center; border-bottom: 1px solid #000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); 
            z-index: 10; flex-wrap: wrap;
        }
        
        .branding { font-weight: 900; color: #fff; letter-spacing: 1px; margin-right: 10px; font-size: 16px;}
        
        .control-group { 
            display: flex; align-items: center; gap: 8px; background: #1a1a1a; 
            padding: 5px 10px; border-radius: 6px; border: 1px solid #333;
        }
        .control-group label { font-size: 12px; color: #ccc; min-width: 50px;}
        .control-group span { font-size: 11px; color: #74ff06; width: 25px; text-align: right;}
        
        input[type="range"] { cursor: pointer; width: 80px; accent-color: #74ff06; }
        
        button { 
            background-color: #333; border: 1px solid #555; color: #fff; 
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; 
        }
        button:hover { background-color: #444; border-color: #74ff06;}
        button.danger { background-color: #520000; border-color: #ff0000; color: #ff9999; }
        
        .workspace { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            background-color: #0a0a0a; overflow: auto; padding: 40px;
        }
        
        .canvas-container { 
            box-shadow: 0 0 40px rgba(116, 255, 6, 0.15); 
            border: 2px solid #333; 
        }
        
        canvas { 
            display: block; 
            background-color: #74ff06; 
            cursor: crosshair; 
        }
        
        .status-bar { 
            background-color: #111; padding: 4px 20px; font-size: 11px; color: #888; 
            border-top: 1px solid #222; display: flex; justify-content: space-between;
        }
        .status-highlight { color: #74ff06; font-weight: bold; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE PRO</div>
        
        <div class="control-group">
            <label>引擎模式</label>
            <span style="width:auto; color:#fff; font-size:12px;">Delaunay Geometric</span>
        </div>

        <div class="control-group">
            <label>线宽</label>
            <input type="range" id="ctrlLineWidth" min="1" max="10" step="1" value="2">
            <span id="valLineWidth">2</span>
        </div>

        <div class="control-group">
            <label>强度</label>
            <input type="range" id="ctrlIntensity" min="0" max="1" step="0.05" value="0.7">
            <span id="valIntensity">0.7</span>
        </div>

        <div class="control-group">
            <label>碎片密度</label>
            <input type="range" id="ctrlDensity" min="20" max="300" step="10" value="100">
            <span id="valDensity">100</span>
        </div>
        
        <button id="btnRandom">随机化生成</button>
        <button id="btnClear" class="danger">重置</button>
    </div>

    <div class="workspace">
        <div class="canvas-container">
            <canvas id="mainCanvas" width="2000" height="100"></canvas>
        </div>
    </div>

    <div class="status-bar">
        <span id="statusText">系统就绪：Delaunay 引擎已加载。</span>
        <span>破裂点：<span id="strikeCount" class="status-highlight">0</span> | 画布: 20:1</span>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const strikeCountDisplay = document.getElementById('strikeCount');
        
        let state = {
            intensity: 0.7,
            density: 100,
            lineWidth: 2,
            strikes: [] 
        };

        // UI 事件绑定
        document.getElementById('ctrlIntensity').oninput = e => {
            state.intensity = parseFloat(e.target.value);
            document.getElementById('valIntensity').innerText = state.intensity.toFixed(1);
        };
        document.getElementById('ctrlDensity').oninput = e => {
            state.density = parseInt(e.target.value);
            document.getElementById('valDensity').innerText = state.density;
        };
        document.getElementById('ctrlLineWidth').oninput = e => {
            state.lineWidth = parseInt(e.target.value);
            document.getElementById('valLineWidth').innerText = state.lineWidth;
        };

        // ----------------------------------------------------
        // Delaunay 几何引擎
        // ----------------------------------------------------
        function generateStrike(originX, originY) {
            const points = [];
            const numPoints = state.density;
            const impactRadius = 300; 

            // 中心核心点
            points.push([originX, originY]);

            for(let i = 0; i < numPoints; i++) {
                const angle = Math.random() * Math.PI * 2;
                // 平方根分布确保中心密集
                const dist = Math.pow(Math.random(), 0.5) * impactRadius;
                
                // 针对 20:1 画布进行纵向拉伸适配
                const px = originX + Math.cos(angle) * dist * 1.2;
                const py = originY + Math.sin(angle) * dist * 0.8;
                
                points.push([px, py]);
            }

            const delaunay = Delaunator.from(points);
            const triangleIndices = delaunay.triangles;
            const shards = [];

            for (let i = 0; i < triangleIndices.length; i += 3) {
                const p1 = points[triangleIndices[i]];
                const p2 = points[triangleIndices[i + 1]];
                const p3 = points[triangleIndices[i + 2]];
                
                const poly = [{x: p1[0], y: p1[1]}, {x: p2[0], y: p2[1]}, {x: p3[0], y: p3[1]}];
                
                const centerX = (p1[0] + p2[0] + p3[0]) / 3;
                const distToStrike = Math.abs(centerX - originX);

                let type = 'none';
                const rand = Math.random();
                if (distToStrike < 15) type = 'black'; 
                else if (distToStrike < 180 && rand < state.intensity) type = 'glitch';
                else if (rand < 0.05) type = 'black';

                shards.push({ polygon: poly, type });
            }

            return { x: originX, y: originY, shards };
        }

        // ----------------------------------------------------
        // 渲染管线
        // ----------------------------------------------------
        function drawGlitchLines(shard) {
            let minX = Infinity, maxX = -Infinity;
            shard.polygon.forEach(p => { if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x; });
            
            const colors = ['#FF0033', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
            const w = state.lineWidth;
            
            for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += w) {
                if (Math.random() < 0.75) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillRect(x, 0, w, canvas.height); 
                }
            }
        }

        function render() {
            // 背景色 #74ff06
            ctx.fillStyle = '#74ff06';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            state.strikes.forEach(strike => {
                // 绘制填充层
                strike.shards.forEach(shard => {
                    if (shard.type === 'none') return;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    ctx.lineTo(shard.polygon[1].x, shard.polygon[1].y);
                    ctx.lineTo(shard.polygon[2].x, shard.polygon[2].y);
                    ctx.closePath();
                    ctx.clip(); 

                    if (shard.type === 'black') {
                        ctx.fillStyle = '#000';
                        ctx.fill();
                    } else if (shard.type === 'glitch') {
                        ctx.fillStyle = '#000';
                        ctx.fill();
                        drawGlitchLines(shard);
                    }
                    ctx.restore();
                });

                // 绘制几何碎裂线条 (移除圆环，保留放射几何线)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 0.5;
                strike.shards.forEach(shard => {
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    ctx.lineTo(shard.polygon[1].x, shard.polygon[1].y);
                    ctx.lineTo(shard.polygon[2].x, shard.polygon[2].y);
                    ctx.closePath();
                    ctx.stroke();
                });

                // 冲击中心点
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(strike.x, strike.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(render);
        }

        function addStrike(x, y) {
            state.strikes.push(generateStrike(x, y));
            strikeCountDisplay.innerText = state.strikes.length;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            addStrike(x, y);
        });

        document.getElementById('btnRandom').onclick = () => {
            addStrike(Math.random() * canvas.width, Math.random() * canvas.height);
        };

        document.getElementById('btnClear').onclick = () => {
            state.strikes = [];
            strikeCountDisplay.innerText = 0;
        };

        // 初始化
        render();
    </script>
</body>
</html>
