<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO - Delaunay Geometric Edition</title>
    <script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; background-color: #111; color: #eee; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { background-color: #222; padding: 10px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #333; z-index: 10; }
        .control-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; border: 1px solid #222; }
        .control-group label { font-size: 10px; color: #888; text-transform: uppercase; }
        .control-group span { font-size: 10px; color: #74ff06; width: 30px; text-align: right; }
        input[type="range"] { cursor: pointer; width: 70px; accent-color: #74ff06; }
        button { background: #222; border: 1px solid #444; color: #fff; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: bold; }
        button:hover { border-color: #74ff06; color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #050505; padding: 20px; }
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div style="font-weight:900; font-size:14px; color:#fff; margin-right:10px">DELAUNAY_FRACTURE</div>
        <div class="control-group">
            <label>碎片数量</label>
            <input type="range" id="ctrlDensity" min="20" max="200" value="80">
            <span id="valDensity">80</span>
        </div>
        <div class="control-group">
            <label>故障强度</label>
            <input type="range" id="ctrlIntensity" min="1" max="100" value="70">
            <span id="valIntensity">70</span>
        </div>
        <button id="btnClear">RESET SYSTEM</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas" width="2000" height="100"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        let state = {
            density: 80,
            intensity: 0.7,
            strikes: [] 
        };

        document.getElementById('ctrlDensity').oninput = e => { state.density = parseInt(e.target.value); document.getElementById('valDensity').innerText = e.target.value; };
        document.getElementById('ctrlIntensity').oninput = e => { state.intensity = e.target.value / 100; document.getElementById('valIntensity').innerText = e.target.value; };
        document.getElementById('btnClear').onclick = () => state.strikes = [];

        function generateStrike(originX, originY) {
            const points = [];
            const numPoints = state.density;
            const impactRadius = 250; // 冲击影响范围

            // 1. 生成随机种子点
            // 冲击中心强制放一个点
            points.push([originX, originY]);

            for(let i = 0; i < numPoints; i++) {
                // 采用极坐标分布，中心密集，外围疏散
                const angle = Math.random() * Math.PI * 2;
                // 模拟冲击波：距离越远点越稀
                const dist = Math.pow(Math.random(), 0.5) * impactRadius;
                
                // 针对 2000x100 的比例，我们在 Y 轴上做适当的拉伸以覆盖全高度
                const px = originX + Math.cos(angle) * dist * 1.2;
                const py = originY + Math.sin(angle) * dist * 0.8;
                
                points.push([px, py]);
            }

            // 2. 调用 Delaunator 进行三角剖分
            const delaunay = Delaunator.from(points);
            const triangleIndices = delaunay.triangles;
            const shards = [];

            // 3. 提取三角形并分类
            for (let i = 0; i < triangleIndices.length; i += 3) {
                const p1 = points[triangleIndices[i]];
                const p2 = points[triangleIndices[i + 1]];
                const p3 = points[triangleIndices[i + 2]];
                
                const poly = [{x: p1[0], y: p1[1]}, {x: p2[0], y: p2[1]}, {x: p3[0], y: p3[1]}];
                
                // 计算重心到原点的距离决定损坏类型
                const centerX = (p1[0] + p2[0] + p3[0]) / 3;
                const distToStrike = Math.abs(centerX - originX);

                let type = 'none';
                const rand = Math.random();
                if (distToStrike < 20) type = 'black'; // 撞击核心区
                else if (distToStrike < 150 && rand < state.intensity) type = 'glitch'; // 故障扩散区
                else if (rand < 0.1) type = 'black'; // 零星坏块

                shards.push({ polygon: poly, type });
            }

            return { x: originX, y: originY, shards };
        }

        function drawGlitchLines(shard) {
            let minX = Infinity, maxX = -Infinity;
            shard.polygon.forEach(p => { if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x; });
            
            const colors = ['#FF0000', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
            const w = 2; // 线宽固定为 2 效果较好
            
            for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += w) {
                if (Math.random() < 0.7) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillRect(x, 0, w, canvas.height); 
                }
            }
        }

        function render() {
            // 背景绿色 #74ff06
            ctx.fillStyle = '#74ff06';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            state.strikes.forEach(strike => {
                // 第一遍：绘制所有填充（黑屏区和故障区）
                strike.shards.forEach(shard => {
                    if (shard.type === 'none') return;

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    ctx.lineTo(shard.polygon[1].x, shard.polygon[1].y);
                    ctx.lineTo(shard.polygon[2].x, shard.polygon[2].y);
                    ctx.closePath();
                    ctx.clip(); 

                    if (shard.type === 'black') {
                        ctx.fillStyle = '#000';
                        ctx.fill();
                    } else if (shard.type === 'glitch') {
                        ctx.fillStyle = '#000';
                        ctx.fill();
                        drawGlitchLines(shard);
                    }
                    ctx.restore();
                });

                // 第二遍：绘制纯粹的几何碎裂线（三角形边缘）
                // 只有放射状和交叉的裂纹，没有圆环
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 0.5;
                strike.shards.forEach(shard => {
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    ctx.lineTo(shard.polygon[1].x, shard.polygon[1].y);
                    ctx.lineTo(shard.polygon[2].x, shard.polygon[2].y);
                    ctx.closePath();
                    ctx.stroke();
                });

                // 冲击中心点微光
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(strike.x, strike.y, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(render);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            state.strikes.push(generateStrike(x, y));
        });

        render();
    </script>
</body>
</html>
