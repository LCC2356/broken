<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO v8.5 - 极细超采样版</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #111; color: #eee; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { background-color: #222; padding: 10px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #000; z-index: 10; flex-wrap: wrap; }
        .branding { font-weight: 900; font-size: 14px; color: #fff; margin-right: 10px; letter-spacing: 1px; border-right: 1px solid #444; padding-right: 15px;}
        .control-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; border: 1px solid #333; }
        .control-group label { font-size: 10px; color: #888; text-transform: uppercase; white-space: nowrap; }
        .control-group span { font-size: 10px; color: #74ff06; width: 25px; text-align: right; font-family: monospace; }
        input[type="range"] { cursor: pointer; width: 50px; accent-color: #74ff06; }
        
        .switch-group { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #888; text-transform: uppercase; margin-left: 5px;}
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 18px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #74ff06; }
        input:checked + .slider:before { transform: translateX(16px); }

        button { background: #333; border: 1px solid #555; color: #fff; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: bold; }
        button:hover { border-color: #74ff06; color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #050505; padding: 20px; }
        
        /* 注意这里的变化：用 CSS 锁死视觉尺寸，Canvas 内部尺寸会被放大以实现超采样 */
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; width: 2000px; height: 100px; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE_v8.5</div>
        <div class="control-group">
            <label>线宽</label>
            <input type="range" id="ctrlLineWidth" min="1" max="150" value="5">
            <span id="valLineWidth">0.5</span>
        </div>
        <div class="control-group">
            <label>密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" value="15">
            <span id="valDensity">15</span>
        </div>
        
        <div class="control-group" style="border-color: #0044FF;">
            <label>横线比例%</label>
            <input type="range" id="ctrlHorizProb" min="0" max="100" value="10">
            <span id="valHorizProb">10</span>
        </div>
        <div class="control-group" style="border-color: #0044FF;">
            <label>竖线贯穿%</label>
            <input type="range" id="ctrlPierceV" min="0" max="100" value="90">
            <span id="valPierceV">90</span>
        </div>
        <div class="control-group" style="border-color: #0044FF;">
            <label>横线贯穿%</label>
            <input type="range" id="ctrlPierceH" min="0" max="100" value="10">
            <span id="valPierceH">10</span>
        </div>
        
        <div class="control-group" style="border-color: #ff009e;">
            <label>裂纹长度%</label>
            <input type="range" id="ctrlCrackScale" min="1" max="100" value="10">
            <span id="valCrackScale">10</span>
        </div>
        <div class="control-group" style="border-color: #ff009e;">
            <label>裂纹粗细</label>
            <input type="range" id="ctrlCrackThick" min="1" max="50" value="5">
            <span id="valCrackThick">0.5</span>
        </div>
        <div class="control-group" style="border-color: #ff009e;">
            <label>高亮大小%</label>
            <input type="range" id="ctrlBlastScale" min="0" max="100" value="5">
            <span id="valBlastScale">5</span>
        </div>

        <div class="switch-group">
            <label>闪烁</label>
            <label class="switch"><input type="checkbox" id="ctrlDynamic" checked><span class="slider"></span></label>
        </div>
        <div class="switch-group">
            <label>裂纹</label>
            <label class="switch"><input type="checkbox" id="ctrlCracks" checked><span class="slider"></span></label>
        </div>
        <div class="switch-group">
            <label>双击</label>
            <label class="switch"><input type="checkbox" id="ctrlDoubleStrike"><span class="slider"></span></label>
        </div>
        <button id="btnClear" style="margin-left: auto;">REBOOT</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        // 🌟 核心升级：设定逻辑宽高与设备超采样倍率 (Device Pixel Ratio)
        const W = 2000;
        const H = 100;
        // 强制最低 2 倍超采样，确保 0.5px 的线能化为纯粹的 1 物理像素点
        const dpr = Math.max(window.devicePixelRatio || 1, 2); 
        
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        // 通过 scale，让所有基于 2000x100 的逻辑坐标系自动放大到物理高清分辨率
        ctx.scale(dpr, dpr);

        let state = {
            density: 0.15, 
            lineWidth: 0.5, // 默认 0.5，在 dpr=2 下是锐利的 1物理像素
            horizProb: 0.10, 
            pierceV: 0.90,   
            pierceH: 0.10,   
            isDynamic: true,
            isDoubleStrike: false, 
            isCracksEnabled: true, 
            impactWidth: 160,
            screenGlitch: 0, 
            polygons: [],
            cracks: [],
            
            crackScale: 0.10,      
            crackThickness: 0.5,   
            blastScale: 0.05       
        };

        // 绑定滑块事件
        document.getElementById('ctrlHorizProb').oninput = e => { state.horizProb = e.target.value / 100; document.getElementById('valHorizProb').innerText = e.target.value; };
        document.getElementById('ctrlPierceV').oninput = e => { state.pierceV = e.target.value / 100; document.getElementById('valPierceV').innerText = e.target.value; };
        document.getElementById('ctrlPierceH').oninput = e => { state.pierceH = e.target.value / 100; document.getElementById('valPierceH').innerText = e.target.value; };

        document.getElementById('ctrlLineWidth').oninput = e => { const val = e.target.value / 10; state.lineWidth = val; document.getElementById('valLineWidth').innerText = val.toFixed(1); };
        document.getElementById('ctrlDensity').oninput = e => { state.density = e.target.value / 100; document.getElementById('valDensity').innerText = e.target.value; };
        
        document.getElementById('ctrlCrackScale').oninput = e => { state.crackScale = e.target.value / 100; document.getElementById('valCrackScale').innerText = e.target.value; };
        document.getElementById('ctrlCrackThick').oninput = e => { const val = e.target.value / 10; state.crackThickness = val; document.getElementById('valCrackThick').innerText = val.toFixed(1); };
        document.getElementById('ctrlBlastScale').oninput = e => { state.blastScale = e.target.value / 100; document.getElementById('valBlastScale').innerText = e.target.value; };

        document.getElementById('ctrlDynamic').onchange = e => { state.isDynamic = e.target.checked; };
        document.getElementById('ctrlCracks').onchange = e => { state.isCracksEnabled = e.target.checked; };
        document.getElementById('ctrlDoubleStrike').onchange = e => { state.isDoubleStrike = e.target.checked; }; 
        document.getElementById('btnClear').onclick = init;

        class CrackNode {
            constructor(cx, cy) {
                this.cx = cx;
                this.cy = cy;
                this.rays = [];
                this.webLines = []; 
                
                this.baseBlastRadius = 30 + Math.random() * 20;

                const numRays = 15 + Math.floor(Math.random() * 10);
                for(let i=0; i<numRays; i++) {
                    const angle = (i / numRays) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
                    const length = (H * 0.5) + Math.random() * 500; 
                    
                    let currentX = 0, currentY = 0;
                    let segments = [];
                    let segCount = 4 + Math.floor(Math.random() * 4);
                    let rayAngle = angle;
                    
                    for(let j=0; j<segCount; j++) {
                        let r = length / segCount;
                        rayAngle += (Math.random() - 0.5) * 0.15; 
                        let nextX = currentX + Math.cos(rayAngle) * r;
                        let nextY = currentY + Math.sin(rayAngle) * r;
                        segments.push({x1: currentX, y1: currentY, x2: nextX, y2: nextY});
                        
                        if (j > 0 && Math.random() > 0.6) {
                            const webAngle = rayAngle + (Math.random() > 0.5 ? Math.PI/2 : -Math.PI/2) + (Math.random()-0.5)*0.2;
                            const webLen = 10 + Math.random() * 30; 
                            this.webLines.push({
                                x1: currentX, y1: currentY, 
                                x2: currentX + Math.cos(webAngle)*webLen, 
                                y2: currentY + Math.sin(webAngle)*webLen
                            });
                        }
                        currentX = nextX;
                        currentY = nextY;
                    }
                    this.rays.push(segments);
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.cx, this.cy);
                ctx.globalAlpha = 1.0; 

                if (state.blastScale > 0) {
                    const blastRadius = this.baseBlastRadius * state.blastScale;
                    const blastGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, blastRadius);
                    blastGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                    blastGradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.9)');
                    blastGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    
                    ctx.fillStyle = blastGradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, blastRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                const scale = state.crackScale;

                ctx.beginPath();
                this.rays.forEach(segments => {
                    segments.forEach(seg => {
                        ctx.moveTo(seg.x1 * scale, seg.y1 * scale);
                        ctx.lineTo(seg.x2 * scale, seg.y2 * scale);
                    });
                });
                this.webLines.forEach(web => {
                    ctx.moveTo(web.x1 * scale, web.y1 * scale);
                    ctx.lineTo(web.x2 * scale, web.y2 * scale);
                });
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.lineWidth = state.crackThickness; 
                ctx.shadowBlur = 0; 
                ctx.stroke();

                ctx.beginPath();
                this.rays.forEach(segments => {
                     let firstSeg = segments[0];
                     ctx.moveTo(firstSeg.x1 * scale, firstSeg.y1 * scale);
                     ctx.lineTo(firstSeg.x2 * scale, firstSeg.y2 * scale);
                });
                ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(0, 255, 255, 0.5)' : 'rgba(255, 0, 255, 0.5)';
                ctx.lineWidth = state.crackThickness; 
                ctx.globalCompositeOperation = 'screen';
                ctx.stroke();

                ctx.restore();
            }
        }

        class Polygon {
            constructor(points, type = 'base', seed = null) {
                this.points = points; 
                this.type = type; 
                this.seed = seed !== null ? seed : Math.random();
            }

            getArea() {
                let area = 0;
                for (let i = 0; i < this.points.length; i++) {
                    let j = (i + 1) % this.points.length;
                    area += this.points[i][0] * this.points[j][1] - this.points[j][0] * this.points[i][1];
                }
                return Math.abs(area) / 2;
            }

            draw() {
                if (this.points.length < 3) return;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.points[0][0], this.points[0][1]);
                for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i][0], this.points[i][1]);
                ctx.closePath();

                if (this.type === 'base') {
                    ctx.fillStyle = '#74ff06'; ctx.fill();
                } else if (this.type === 'pink') {
                    ctx.fillStyle = '#ff009e'; ctx.fill();
                } else {
                    ctx.fillStyle = '#000'; ctx.fill();
                    if (this.type === 'glitch' && state.lineWidth > 0) {
                        ctx.save();
                        ctx.clip();
                        this.drawGlitchLines();
                        this.drawInnerGradient();
                        ctx.restore();
                    }
                }

                if (this.type !== 'base') {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawInnerGradient() {
                let cx = 0, cy = 0; this.points.forEach(p => { cx += p[0]; cy += p[1]; });
                cx /= this.points.length; cy /= this.points.length;
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0.25)');
                ctx.fillStyle = grad; ctx.fill();
            }

            drawGlitchLines() {
                let minX = W, maxX = 0;
                let minY = H, maxY = 0;
                this.points.forEach(p => { 
                    if(p[0] < minX) minX = p[0]; if(p[0] > maxX) maxX = p[0]; 
                    if(p[1] < minY) minY = p[1]; if(p[1] > maxY) maxY = p[1];
                });
                
                const colors = ['#FF0033', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
                
                const w = Math.max(0.01, state.lineWidth); 
                const step = Math.max(1, w); 
                
                const isHorizontal = this.absRandom(this.seed, 99.9) < state.horizProb; 

                if (!isHorizontal) {
                    for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += step) {
                        const isPiercing = this.absRandom(x, 111.11) < state.pierceV;
                        const seedToUse = isPiercing ? 222.22 : this.seed;
                        const noise = this.absRandom(x, seedToUse);
                        
                        if (noise < state.density) {
                            if (state.isDynamic) {
                                const flicker = Math.random();
                                if (flicker < 0.1) continue;
                                if (flicker < 0.3) ctx.globalAlpha = 0.4;
                            }
                            ctx.fillStyle = colors[Math.floor(noise * colors.length * 13) % colors.length];
                            ctx.fillRect(x, 0, w, H); 
                            ctx.globalAlpha = 1.0;
                        }
                    }
                } else {
                    for (let y = Math.floor(minY); y <= Math.ceil(maxY); y += step) {
                        const isPiercing = this.absRandom(y, 333.33) < state.pierceH;
                        const seedToUse = isPiercing ? 444.44 : this.seed;
                        const noise = this.absRandom(y, seedToUse + 500); 
                        
                        if (noise < state.density) {
                            if (state.isDynamic) {
                                const flicker = Math.random();
                                if (flicker < 0.1) continue;
                                if (flicker < 0.3) ctx.globalAlpha = 0.4;
                            }
                            ctx.fillStyle = colors[Math.floor(noise * colors.length * 13) % colors.length];
                            ctx.fillRect(0, y, W, w); 
                            ctx.globalAlpha = 1.0;
                        }
                    }
                }
            }

            absRandom(x, s) {
                let val = Math.sin(x * 12.9898 + s * 78.233) * 43758.5453;
                return val - Math.floor(val);
            }
        }

        function generatePolyline(xBase, my, angleDeg) {
            const path = [];
            const segments = 4; 
            const tanA = Math.tan(angleDeg * Math.PI / 180);
            for (let i = 0; i <= segments; i++) {
                const y = (H / segments) * i;
                const x = xBase + (y - my) * tanA + (Math.random() - 0.5) * 20;
                path.push([x, y]);
            }
            return path;
        }

        function sliceByPolyline(polyPoints, path) {
            let left = [], right = [];
            const getXAtY = (y) => {
                for (let i = 0; i < path.length - 1; i++) {
                    if (y >= path[i][1] && y <= path[i+1][1]) {
                        const t = (y - path[i][1]) / (path[i+1][1] - path[i][1]);
                        return path[i][0] + t * (path[i+1][0] - path[i][0]);
                    }
                }
                return path[0][0];
            };
            const getSide = (p) => p[0] - getXAtY(p[1]);
            for (let i = 0; i < polyPoints.length; i++) {
                let p1 = polyPoints[i], p2 = polyPoints[(i + 1) % polyPoints.length];
                let s1 = getSide(p1), s2 = getSide(p2);
                if (s1 < 0) left.push(p1); else right.push(p1);
                if ((s1 < 0 && s2 >= 0) || (s1 >= 0 && s2 < 0)) {
                    let d = Math.abs(s1) + Math.abs(s2);
                    let t = d < 0.0001 ? 0.5 : Math.abs(s1) / d;
                    let iy = p1[1] + (p2[1] - p1[1]) * t;
                    let ix = getXAtY(iy);
                    left.push([ix, iy]); right.push([ix, iy]);
                }
            }
            return [left, right];
        }

        function init() {
            state.polygons = [new Polygon([[0, 0], [W, 0], [W, H], [0, H]], 'base', null)];
            state.cracks = []; 
        }

        function triggerImpact(cx, cy) {
            if (state.isCracksEnabled) {
                state.cracks.push(new CrackNode(cx, cy));
                if (state.cracks.length > 150) state.cracks.shift(); 
            }

            const angL = (Math.random() - 0.5) * 30; 
            const angR = (Math.random() - 0.5) * 30;
            const xL = cx - (40 + Math.random() * 40);
            const xR = cx + (40 + Math.random() * 40);
            const pathL = generatePolyline(xL, cy, angL);
            const pathR = generatePolyline(xR, cy, angR);
            
            let nextPolygons = [];
            const impactSeed = Math.random();
            
            state.polygons.forEach(target => {
                let minX = W, maxX = 0;
                target.points.forEach(p => { if(p[0]<minX) minX=p[0]; if(p[0]>maxX) maxX=p[0]; });
                if (maxX < xL - 100 || minX > xR + 100) {
                    nextPolygons.push(target);
                    return;
                }
                let [pLeft, pRest] = sliceByPolyline(target.points, pathL);
                if (pRest.length > 2) {
                    let [pMid, pRight] = sliceByPolyline(pRest, pathR);
                    if (pMid.length > 2) {
                        const fragments = shatter(pMid, cx, cy, impactSeed);
                        nextPolygons.push(...fragments);
                    }
                    if (pLeft.length > 2) nextPolygons.push(new Polygon(pLeft, target.type, target.seed));
                    if (pRight.length > 2) nextPolygons.push(new Polygon(pRight, target.type, target.seed));
                } else {
                    if (pLeft.length > 2) nextPolygons.push(new Polygon(pLeft, target.type, target.seed));
                }
            });
            
            state.polygons = nextPolygons.filter(p => p.getArea() > 0.5).slice(0, 1000);
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2) return;
            state.screenGlitch = 8; 
            
            const rect = canvas.getBoundingClientRect();
            // 鼠标交互现在映射回 2000x100 的逻辑坐标系
            const mx = (e.clientX - rect.left) * (W / rect.width);
            const my = (e.clientY - rect.top) * (H / rect.height);
            
            triggerImpact(mx, my);

            if (state.isDoubleStrike) {
                const offsetX = (Math.random() - 0.5) * 60;
                const offsetY = (Math.random() - 0.5) * 60;
                triggerImpact(mx + offsetX, my + offsetY);
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault(); 
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (W / rect.width);
            const half = H / 2;
            const squarePoints = [[mx - half, 0], [mx + half, 0], [mx + half, H], [mx - half, H]];
            state.polygons.push(new Polygon(squarePoints, 'pink', null));
        });

        function shatter(points, mx, my, impactSeed) {
            const res = [];
            for (let i = 0; i < points.length; i++) {
                const p1 = points[i], p2 = points[(i + 1) % points.length];
                const r = 0.3 + Math.random() * 0.4;
                const mid = [p1[0] + (p2[0]-p1[0])*r, p1[1] + (p2[1]-p1[1])*r];
                const type1 = Math.random() < 0.7 ? 'glitch' : 'black';
                const type2 = Math.random() < 0.4 ? 'glitch' : 'black';
                const getSeed = (s) => Math.random() < 0.5 ? impactSeed : Math.random();
                res.push(new Polygon([p1, mid, [mx, my]], type1, getSeed()));
                res.push(new Polygon([mid, p2, [mx, my]], type2, getSeed()));
            }
            return res;
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            ctx.save(); 
            if (state.screenGlitch > 0) {
                state.screenGlitch--;
                const shake = state.screenGlitch * 1.5; 
                ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
            }
            
            state.polygons.forEach(p => p.draw());
            state.cracks.forEach(c => c.draw());

            if (state.screenGlitch > 0) {
                if (Math.random() > 0.5) {
                    ctx.globalCompositeOperation = 'difference';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; 
                    ctx.fillRect(0, 0, W, H);
                    ctx.globalCompositeOperation = 'source-over'; 
                } else if (Math.random() > 0.7) {
                    ctx.fillStyle = 'rgba(255, 0, 158, 0.15)'; 
                    ctx.fillRect(0, 0, W, H);
                }
            }
            ctx.restore(); 
            
            // 🌟 物理屏幕撕裂特效：因为 ctx 被 scale 放大了，所以这里需要在物理像素空间截取
            if (state.screenGlitch > 0 && Math.random() > 0.3) {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0); // 重置到物理像素系
                const sliceY = Math.random() * canvas.height;
                const sliceH = (Math.random() * 8 + 2) * dpr; 
                const offset = (Math.random() - 0.5) * 40 * dpr;
                ctx.drawImage(canvas, 0, sliceY, canvas.width, sliceH, offset, sliceY, canvas.width, sliceH);
                ctx.restore();
            }
            requestAnimationFrame(render);
        }

        init(); render();
    </script>
</body>
</html>
