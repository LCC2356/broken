<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>屏幕破碎实验室 - 终极版</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #111; color: #eee; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            user-select: none;
        }
        
        /* 顶部控制台 */
        .toolbar { 
            background-color: #222; padding: 15px 20px; display: flex; gap: 20px; 
            align-items: center; border-bottom: 1px solid #000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); 
            z-index: 10; flex-wrap: wrap;
        }
        
        .branding { font-weight: 900; color: #fff; letter-spacing: 1px; margin-right: 15px; font-size: 16px;}
        
        .control-group { 
            display: flex; align-items: center; gap: 10px; background: #1a1a1a; 
            padding: 6px 12px; border-radius: 6px; border: 1px solid #333;
        }
        .control-group label { font-size: 13px; color: #ccc; min-width: 60px;}
        .control-group span { font-size: 12px; color: #00ff00; width: 30px; text-align: right;}
        
        input[type="range"] { cursor: pointer; }
        
        button { 
            background-color: #333; border: 1px solid #555; color: #fff; 
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; 
        }
        button:hover { background-color: #444; border-color: #888;}
        button:active { background-color: #222; }
        button.danger { background-color: #520000; border-color: #ff0000; color: #ff9999; }
        button.danger:hover { background-color: #7a0000; }
        
        /* 画布工作区 */
        .workspace { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            background-color: #0a0a0a; overflow: auto; padding: 40px;
        }
        
        .canvas-container { 
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.1); 
            border: 2px solid #333; 
        }
        
        /* 纯绿背景画布 */
        canvas { 
            display: block; 
            background-color: #00ff00; 
            cursor: crosshair; 
        }
        
        /* 底部状态栏 */
        .status-bar { 
            background-color: #111; padding: 6px 20px; font-size: 12px; color: #888; 
            border-top: 1px solid #222; display: flex; justify-content: space-between;
        }
        .status-highlight { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE ENGINE</div>
        
        <div class="control-group">
            <label>故障强度</label>
            <input type="range" id="ctrlIntensity" min="0" max="1" step="0.05" value="0.9" style="width: 120px;">
            <span id="valIntensity">0.9</span>
        </div>

        <div class="control-group">
            <label>条纹密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" step="1" value="60" style="width: 120px;">
            <span id="valDensity">60</span>
        </div>
        
        <button id="btnRandom">随机化生成</button>
        <button id="btnClear" class="danger">清空所有破碎点</button>
    </div>

    <div class="workspace">
        <div class="canvas-container">
            <canvas id="mainCanvas" width="2000" height="100"></canvas>
        </div>
    </div>

    <div class="status-bar">
        <span id="statusText">系统就绪。等待输入...</span>
        <span>当前破裂点数：<span id="strikeCount" class="status-highlight">0</span> | 画布: 2000x100</span>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const strikeCountDisplay = document.getElementById('strikeCount');
        
        // --- 核心状态 ---
        let state = {
            intensity: 0.9,
            density: 60,
            strikes: [] // 存储所有砸击点
        };

        // --- UI 事件绑定 ---
        document.getElementById('ctrlIntensity').addEventListener('input', (e) => {
            state.intensity = parseFloat(e.target.value);
            document.getElementById('valIntensity').innerText = state.intensity.toFixed(1);
        });

        document.getElementById('ctrlDensity').addEventListener('input', (e) => {
            state.density = parseInt(e.target.value);
            document.getElementById('valDensity').innerText = state.density;
        });

        // ----------------------------------------------------
        // 几何生成引擎：生成不规则物理碎片
        // ----------------------------------------------------
        function generatePhysicalShards(originX, originY) {
            const shards = [];
            // 减少射线条数，让碎片更大、更有棱角，合并时更自然
            const rayCount = Math.floor(Math.random() * 6) + 8; 
            const angles = [];
            for(let i=0; i<rayCount; i++) {
                angles.push((Math.PI * 2 / rayCount) * i + (Math.random() * 0.5 - 0.25));
            }
            angles.sort();

            // 爆炸环向外扩散的半径 (覆盖极宽的画布)
            const rings = [0, 20, 60, 150, 400, 1000, 2500]; 
            
            const vertices = [];
            for (let r = 0; r < rings.length; r++) {
                const ringVertices = [];
                for (let a = 0; a < rayCount; a++) {
                    // 加入强烈的随机锯齿，让碎片极度不规则
                    const radius = rings[r] + (r > 0 ? (Math.random() * rings[r] * 0.5) : 0); 
                    const angle = angles[a];
                    ringVertices.push({
                        x: originX + Math.cos(angle) * radius,
                        y: originY + Math.sin(angle) * radius
                    });
                }
                vertices.push(ringVertices);
            }

            for (let r = 0; r < rings.length - 1; r++) {
                for (let a = 0; a < rayCount; a++) {
                    const nextA = (a + 1) % rayCount;
                    const p1 = vertices[r][a];
                    const p2 = vertices[r+1][a];
                    const p3 = vertices[r+1][nextA];
                    const p4 = vertices[r][nextA];

                    let damageType = 'none';
                    const rand = Math.random();
                    
                    // 核心区域大面积纯黑，边缘逐渐过渡为线条和色块
                    if (r <= 1 || (r === 2 && rand > 0.4)) {
                        damageType = 'black'; // 纯黑漏液
                    } else if (r <= 4 && rand > 0.3) {
                        damageType = 'glitchLines'; // 1px 排线故障
                    } else if (r <= 5 && rand > 0.8) {
                        damageType = 'glitchBlocks'; // 块状故障
                    }

                    shards.push({
                        polygon: [p1, p2, p3, p4],
                        type: damageType
                    });
                }
            }
            return { x: originX, y: originY, shards: shards };
        }

        // ----------------------------------------------------
        // 渲染管线 (分层渲染，确保多击完美融合)
        // ----------------------------------------------------
        
        function getBoundingBox(polygon) {
            let minX = Infinity, maxX = -Infinity;
            polygon.forEach(p => {
                if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
            });
            // 只需 X 轴边界，Y 轴强制贯穿
            return {minX, maxX};
        }

        // 绘制 1px 贯穿排线
        function drawGlitchLines(shard) {
            const bbox = getBoundingBox(shard.polygon);
            // 纯粹的电子屏幕故障色
            const colors = ['#FF0000', '#00FF00', '#0000FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00'];
            
            for (let x = Math.floor(bbox.minX); x <= Math.ceil(bbox.maxX); x++) {
                // 基于密度和强度决定是否在这 1px 画线
                if (Math.random() < (state.density / 100) * state.intensity) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    // 强制高度为 0 到 canvas.height，配合 Clip 实现占满碎片区域
                    ctx.fillRect(x, 0, 1, canvas.height); 
                }
            }
        }

        // 绘制块状错位
        function drawGlitchBlocks(shard) {
            const bbox = getBoundingBox(shard.polygon);
            const colors = ['#FF0055', '#00FFAA', '#0055FF', '#111111'];
            for (let i = 0; i < 5 * state.intensity; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const width = Math.random() * 100 + 20;
                const height = Math.random() * 5 + 1;
                const x = bbox.minX + Math.random() * (bbox.maxX - bbox.minX);
                const y = Math.random() * canvas.height;
                ctx.fillRect(x, y, width, height);
            }
        }

        function render() {
            // 1. 底色：纯绿 (#00ff00)
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 收集所有碎片以便分层处理
            const allBlackShards = [];
            const allLineShards = [];
            const allBlockShards = [];

            state.strikes.forEach(strike => {
                strike.shards.forEach(shard => {
                    if (shard.type === 'black') allBlackShards.push(shard);
                    else if (shard.type === 'glitchLines') allLineShards.push(shard);
                    else if (shard.type === 'glitchBlocks') allBlockShards.push(shard);
                });
            });

            // 工具函数：应用遮罩并执行绘制
            const applyClipAndDraw = (shards, drawFunc, fillBlackFirst = false) => {
                shards.forEach(shard => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) {
                        ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    }
                    ctx.closePath();
                    ctx.clip(); // 核心：限制渲染区域

                    if (fillBlackFirst) {
                        ctx.fillStyle = '#000000'; // 纯黑底色，杜绝灰色
                        ctx.fill();
                    }
                    drawFunc(shard);
                    ctx.restore();
                });
            };

            // --- 分层渲染执行 ---
            
            // 层级 1: 所有纯黑死像素区 (完美融合成一片)
            applyClipAndDraw(allBlackShards, () => {
                ctx.fillStyle = '#000000';
                ctx.fill();
            });

            // 层级 2: 所有 1px 排线故障区 (自带纯黑底)
            applyClipAndDraw(allLineShards, drawGlitchLines, true);

            // 层级 3: 所有块状错位区 (自带纯黑底)
            applyClipAndDraw(allBlockShards, drawGlitchBlocks, true);

            // 层级 4: 在最上层绘制极其锋利的玻璃裂纹线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; // 微弱的白色玻璃反光
            ctx.lineWidth = 0.5;
            state.strikes.forEach(strike => {
                strike.shards.forEach(shard => {
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) {
                        ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    }
                    ctx.stroke();
                });
                
                // 撞击极点
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(strike.x, strike.y, 1.5, 0, Math.PI*2);
                ctx.fill();
            });

            // 保持动态闪烁 (大约 24fps 的抖动感)
            setTimeout(() => {
                requestAnimationFrame(render);
            }, 40);
        }

        // --- 交互逻辑 ---
        
        function addStrike(x, y) {
            state.strikes.push(generatePhysicalShards(x, y));
            strikeCountDisplay.innerText = state.strikes.length;
            statusText.innerText = `新增破裂原点 (X: ${Math.round(x)})。图层正在融合。`;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            addStrike(x, y);
        });

        document.getElementById('btnRandom').addEventListener('click', () => {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            addStrike(x, y);
        });

        document.getElementById('btnClear').addEventListener('click', () => {
            state.strikes = [];
            strikeCountDisplay.innerText = 0;
            statusText.innerText = '图层已清空，恢复纯绿底色。';
        });

        // 初始首次撞击 (参考图右上角偏左一点的位置)
        addStrike(canvas.width * 0.75, canvas.height * 0.2);

        // 启动渲染引擎
        render();

    </script>
</body>
</html>
