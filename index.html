<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>屏幕破碎实验室 - 专业增强版</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #111; color: #eee; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            user-select: none;
        }
        
        /* 顶部控制台 */
        .toolbar { 
            background-color: #222; padding: 10px 20px; display: flex; gap: 15px; 
            align-items: center; border-bottom: 1px solid #000; box-shadow: 0 4px 15px rgba(0,0,0,0.8); 
            z-index: 10; flex-wrap: wrap;
        }
        
        .branding { font-weight: 900; color: #fff; letter-spacing: 1px; margin-right: 10px; font-size: 16px;}
        
        .control-group { 
            display: flex; align-items: center; gap: 8px; background: #1a1a1a; 
            padding: 5px 10px; border-radius: 6px; border: 1px solid #333;
        }
        .control-group label { font-size: 12px; color: #ccc; min-width: 50px;}
        .control-group span { font-size: 11px; color: #00ff00; width: 25px; text-align: right;}
        
        select {
            background: #333; color: #fff; border: 1px solid #555; padding: 4px; border-radius: 4px; font-size: 12px;
        }

        input[type="range"] { cursor: pointer; width: 80px; }
        
        button { 
            background-color: #333; border: 1px solid #555; color: #fff; 
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; 
        }
        button:hover { background-color: #444; border-color: #888;}
        button.danger { background-color: #520000; border-color: #ff0000; color: #ff9999; }
        
        .workspace { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            background-color: #0a0a0a; overflow: auto; padding: 40px;
        }
        
        .canvas-container { 
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.1); 
            border: 2px solid #333; 
        }
        
        canvas { 
            display: block; 
            background-color: #00ff00; 
            cursor: crosshair; 
        }
        
        .status-bar { 
            background-color: #111; padding: 4px 20px; font-size: 11px; color: #888; 
            border-top: 1px solid #222; display: flex; justify-content: space-between;
        }
        .status-highlight { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE PRO</div>
        
        <div class="control-group">
            <label>破裂形状</label>
            <select id="ctrlShape">
                <option value="radial">经典放射</option>
                <option value="shattered">尖锐碎玻璃</option>
                <option value="web">密集蜘蛛网</option>
            </select>
        </div>

        <div class="control-group">
            <label>故障线宽</label>
            <input type="range" id="ctrlLineWidth" min="1" max="10" step="1" value="1">
            <span id="valLineWidth">1</span>
        </div>

        <div class="control-group">
            <label>强度</label>
            <input type="range" id="ctrlIntensity" min="0" max="1" step="0.05" value="0.9">
            <span id="valIntensity">0.9</span>
        </div>

        <div class="control-group">
            <label>密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" step="1" value="60">
            <span id="valDensity">60</span>
        </div>
        
        <button id="btnRandom">随机化生成</button>
        <button id="btnClear" class="danger">重置</button>
    </div>

    <div class="workspace">
        <div class="canvas-container">
            <canvas id="mainCanvas" width="2000" height="100"></canvas>
        </div>
    </div>

    <div class="status-bar">
        <span id="statusText">系统就绪。</span>
        <span>破裂点：<span id="strikeCount" class="status-highlight">0</span> | 画布: 20:1</span>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const strikeCountDisplay = document.getElementById('strikeCount');
        
        let state = {
            intensity: 0.9,
            density: 60,
            lineWidth: 1,
            shape: 'radial',
            strikes: [] 
        };

        // UI 事件绑定
        document.getElementById('ctrlIntensity').oninput = e => {
            state.intensity = parseFloat(e.target.value);
            document.getElementById('valIntensity').innerText = state.intensity.toFixed(1);
        };
        document.getElementById('ctrlDensity').oninput = e => {
            state.density = parseInt(e.target.value);
            document.getElementById('valDensity').innerText = state.density;
        };
        document.getElementById('ctrlLineWidth').oninput = e => {
            state.lineWidth = parseInt(e.target.value);
            document.getElementById('valLineWidth').innerText = state.lineWidth;
        };
        document.getElementById('ctrlShape').onchange = e => state.shape = e.target.value;

        // ----------------------------------------------------
        // 多形状几何引擎
        // ----------------------------------------------------
        function generatePhysicalShards(originX, originY, shapeType) {
            const shards = [];
            let rayCount, rings;

            // 根据形状调整基本参数
            if (shapeType === 'shattered') {
                rayCount = Math.floor(Math.random() * 5) + 6; // 较少的长射线
                rings = [0, 40, 150, 600, 2500];
            } else if (shapeType === 'web') {
                rayCount = Math.floor(Math.random() * 10) + 15; // 密集的射线
                rings = [0, 10, 25, 50, 100, 200, 400, 800, 2500];
            } else { // radial
                rayCount = Math.floor(Math.random() * 6) + 10;
                rings = [0, 20, 60, 150, 400, 1000, 2500];
            }

            const angles = [];
            for(let i=0; i<rayCount; i++) {
                angles.push((Math.PI * 2 / rayCount) * i + (Math.random() * 0.4 - 0.2));
            }
            angles.sort();

            const vertices = [];
            for (let r = 0; r < rings.length; r++) {
                const ringVertices = [];
                for (let a = 0; a < rayCount; a++) {
                    // shattered 形状锯齿更强，web 形状圆度更高
                    const jitter = shapeType === 'shattered' ? 0.8 : (shapeType === 'web' ? 0.2 : 0.5);
                    const radius = rings[r] + (r > 0 ? (Math.random() * rings[r] * jitter) : 0); 
                    const angle = angles[a];
                    ringVertices.push({
                        x: originX + Math.cos(angle) * radius,
                        y: originY + Math.sin(angle) * radius
                    });
                }
                vertices.push(ringVertices);
            }

            for (let r = 0; r < rings.length - 1; r++) {
                for (let a = 0; a < rayCount; a++) {
                    const nextA = (a + 1) % rayCount;
                    const p1 = vertices[r][a];
                    const p2 = vertices[r+1][a];
                    const p3 = vertices[r+1][nextA];
                    const p4 = vertices[r][nextA];

                    let damageType = 'none';
                    const rand = Math.random();
                    
                    if (r <= 1 || (r === 2 && rand > 0.4)) {
                        damageType = 'black';
                    } else if (r <= (shapeType === 'web' ? 6 : 4) && rand > 0.3) {
                        damageType = 'glitchLines';
                    } else if (r <= 5 && rand > 0.85) {
                        damageType = 'glitchBlocks';
                    }

                    shards.push({ polygon: [p1, p2, p3, p4], type: damageType });
                }
            }
            return { x: originX, y: originY, shards: shards };
        }

        // ----------------------------------------------------
        // 渲染管线
        // ----------------------------------------------------
        function getBoundingBox(polygon) {
            let minX = Infinity, maxX = -Infinity;
            polygon.forEach(p => {
                if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
            });
            return {minX, maxX};
        }

        function drawGlitchLines(shard) {
            const bbox = getBoundingBox(shard.polygon);
            const colors = ['#FF0000', '#00FF00', '#0000FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00'];
            
            // 使用当前状态中的线宽
            const w = state.lineWidth;
            
            for (let x = Math.floor(bbox.minX); x <= Math.ceil(bbox.maxX); x += w) {
                if (Math.random() < (state.density / 100) * state.intensity) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillRect(x, 0, w, canvas.height); 
                }
            }
        }

        function drawGlitchBlocks(shard) {
            const bbox = getBoundingBox(shard.polygon);
            const colors = ['#FF0055', '#00FFAA', '#0055FF', '#111111'];
            for (let i = 0; i < 5 * state.intensity; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const width = Math.random() * 100 + 20;
                const height = Math.random() * 5 + 1;
                const x = bbox.minX + Math.random() * (bbox.maxX - bbox.minX);
                const y = Math.random() * canvas.height;
                ctx.fillRect(x, y, width, height);
            }
        }

        function render() {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const allBlackShards = [];
            const allLineShards = [];
            const allBlockShards = [];

            state.strikes.forEach(strike => {
                strike.shards.forEach(shard => {
                    if (shard.type === 'black') allBlackShards.push(shard);
                    else if (shard.type === 'glitchLines') allLineShards.push(shard);
                    else if (shard.type === 'glitchBlocks') allBlockShards.push(shard);
                });
            });

            const applyClipAndDraw = (shards, drawFunc, fillBlackFirst = false) => {
                shards.forEach(shard => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) {
                        ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    }
                    ctx.closePath();
                    ctx.clip(); 

                    if (fillBlackFirst) {
                        ctx.fillStyle = '#000000';
                        ctx.fill();
                    }
                    drawFunc(shard);
                    ctx.restore();
                });
            };

            applyClipAndDraw(allBlackShards, () => {
                ctx.fillStyle = '#000000';
                ctx.fill();
            });

            applyClipAndDraw(allLineShards, drawGlitchLines, true);
            applyClipAndDraw(allBlockShards, drawGlitchBlocks, true);

            // 玻璃裂纹线条
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 0.5;
            state.strikes.forEach(strike => {
                strike.shards.forEach(shard => {
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) {
                        ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    }
                    ctx.stroke();
                });
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(strike.x, strike.y, 1.5, 0, Math.PI*2);
                ctx.fill();
            });

            setTimeout(() => {
                requestAnimationFrame(render);
            }, 40);
        }

        function addStrike(x, y) {
            // 记录当前选中的形状
            state.strikes.push(generatePhysicalShards(x, y, state.shape));
            strikeCountDisplay.innerText = state.strikes.length;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            addStrike(x, y);
        });

        document.getElementById('btnRandom').onclick = () => {
            addStrike(Math.random() * canvas.width, Math.random() * canvas.height);
        };

        document.getElementById('btnClear').onclick = () => {
            state.strikes = [];
            strikeCountDisplay.innerText = 0;
        };

        // 默认初始化一个
        addStrike(canvas.width * 0.75, canvas.height * 0.2);
        render();

    </script>
</body>
</html>
