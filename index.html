<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>屏幕破碎实验室 - 最终修正版</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #1a1a1a; color: #eee; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* 顶部工具栏：Adobe 风格 */
        .toolbar { 
            background-color: #2b2b2b; padding: 12px 20px; display: flex; gap: 15px; 
            align-items: center; border-bottom: 1px solid #000; z-index: 100;
        }
        
        .branding { font-weight: 900; font-size: 14px; color: #fff; margin-right: 15px; }
        
        .control-group { 
            display: flex; align-items: center; gap: 8px; background: #222; 
            padding: 5px 12px; border-radius: 4px; border: 1px solid #3d3d3d;
        }
        .control-group label { font-size: 12px; color: #aaa; }
        
        input[type="range"] { width: 80px; accent-color: #007acc; }

        button { 
            background: #444; border: 1px solid #555; color: #fff; padding: 6px 12px;
            border-radius: 3px; cursor: pointer; font-size: 12px;
        }
        button:hover { background: #555; }
        button.danger { color: #ff6b6b; border-color: #663333; }
        
        /* 画布区域 */
        .workspace { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            background-color: #0f0f0f; padding: 20px;
        }
        
        .canvas-shadow { box-shadow: 0 0 50px rgba(0,0,0,0.9); border: 1px solid #333; }
        
        canvas { 
            background-color: #00ff00; /* 纯绿背景 */
            display: block; cursor: crosshair; 
        }

        .status { padding: 4px 20px; background: #222; font-size: 11px; color: #666; border-top: 1px solid #000; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="branding">FRACTURE FX PRO</div>
    
    <div class="control-group">
        <label>强度</label>
        <input type="range" id="itst" min="0" max="1" step="0.1" value="0.9">
    </div>

    <div class="control-group">
        <label>密度</label>
        <input type="range" id="dens" min="1" max="100" value="60">
    </div>

    <div class="control-group">
        <label>聚集度</label>
        <input type="range" id="clus" min="0" max="1" step="0.1" value="0.7">
    </div>

    <div class="control-group">
        <label>黑斑半径</label>
        <input type="range" id="lrad" min="10" max="150" value="45">
    </div>

    <button id="btnRandom">随机砸击</button>
    <button id="btnClear" class="danger">清空画板</button>
</div>

<div class="workspace">
    <div class="canvas-shadow">
        <canvas id="cvs" width="2000" height="100"></canvas>
    </div>
</div>

<div class="status">
    状态: <span id="msg" style="color:#00ff00">就绪</span> | 比例: 20:1 | 画布尺寸: 2000x100
</div>

<script>
    const canvas = document.getElementById('cvs');
    const ctx = canvas.getContext('2d');
    const msg = document.getElementById('msg');
    
    let state = {
        intensity: 0.9,
        density: 60,
        clustering: 0.7,
        leakRadius: 45,
        strikes: [],
        animPhase: 'IDLE', // IDLE, GLITCHING
        phaseTimer: 0
    };

    // 监听控件
    document.getElementById('itst').oninput = e => state.intensity = parseFloat(e.target.value);
    document.getElementById('dens').oninput = e => state.density = parseInt(e.target.value);
    document.getElementById('clus').oninput = e => state.clustering = parseFloat(e.target.value);
    document.getElementById('lrad').oninput = e => state.leakRadius = parseInt(e.target.value);

    // 生成物理破裂数据
    function createFracture(x, y) {
        const shards = [];
        const rays = 12;
        const radiusLimit = 200 + Math.random() * 80; // 影响范围 200-280px

        // 漏液区域由一组随机圆组成，形成自然融合感
        const leaks = [];
        for(let i=0; i<6; i++) {
            leaks.push({
                ox: (Math.random()-0.5)*40,
                oy: (Math.random()-0.5)*20,
                r: state.leakRadius * (0.6 + Math.random()*0.5)
            });
        }

        // 碎片多边形生成
        for(let i=0; i<rays; i++) {
            const a1 = (i / rays) * Math.PI * 2;
            const a2 = ((i+1) / rays) * Math.PI * 2;
            const r1 = radiusLimit * (0.8 + Math.random()*0.4);
            
            shards.push({
                points: [
                    {x: x, y: y},
                    {x: x + Math.cos(a1)*r1, y: y + Math.sin(a1)*r1},
                    {x: x + Math.cos(a2)*r1, y: y + Math.sin(a2)*r1}
                ],
                hasLines: Math.random() < 0.8
            });
        }

        return { x, y, shards, leaks };
    }

    // 核心绘制逻辑
    function draw() {
        // 1. 基础绿背
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (state.strikes.length === 0) return;

        // 2. 绘制漏液黑斑层 (合并所有点击的黑斑)
        ctx.fillStyle = '#000000';
        state.strikes.forEach(s => {
            s.leaks.forEach(l => {
                ctx.beginPath();
                ctx.arc(s.x + l.ox, s.y + l.oy, l.r, 0, Math.PI*2);
                ctx.fill();
            });
        });

        // 3. 绘制故障线与碎片
        state.strikes.forEach(s => {
            s.shards.forEach(shard => {
                ctx.save();
                // 裁剪出碎片区域
                ctx.beginPath();
                ctx.moveTo(shard.points[0].x, shard.points[0].y);
                ctx.lineTo(shard.points[1].x, shard.points[1].y);
                ctx.lineTo(shard.points[2].x, shard.points[2].y);
                ctx.closePath();
                ctx.clip();

                // 如果处于闪烁阶段，则重新绘制线条
                if (state.animPhase === 'GLITCHING' && shard.hasLines) {
                    drawClusteredLines(shard);
                } else if (state.animPhase === 'IDLE' && shard.hasLines) {
                    // 静态时也需要保留基础纹理
                    drawClusteredLines(shard, true); 
                }
                ctx.restore();
            });

            // 4. 绘制裂纹线条 (细白线)
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 0.5;
            s.shards.forEach(shard => {
                ctx.beginPath();
                ctx.moveTo(shard.points[0].x, shard.points[0].y);
                ctx.lineTo(shard.points[1].x, shard.points[1].y);
                ctx.lineTo(shard.points[2].x, shard.points[2].y);
                ctx.stroke();
            });
        });
    }

    function drawClusteredLines(shard, isStatic = false) {
        // 伪随机种子，保证静态时线条不乱跳
        const seed = isStatic ? shard.points[1].x : Math.random();
        const colors = ['#ff0000', '#0000ff', '#ff00ff', '#00ffff', '#ffffff', '#ffff00'];
        
        let xMin = Math.min(...shard.points.map(p => p.x));
        let xMax = Math.max(...shard.points.map(p => p.x));

        for (let x = Math.floor(xMin); x < xMax; x++) {
            // 聚集度算法：控制线条成簇
            const noise = Math.sin(x * 0.5) * Math.cos(x * 0.2);
            const threshold = 1.0 - (state.density / 100);
            
            if (Math.random() > threshold + (noise * state.clustering)) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillRect(x, 0, 1, canvas.height); // 1px 贯穿
            }
        }
    }

    // 动画节奏控制器
    function loop() {
        if (state.phaseTimer <= 0) {
            if (state.animPhase === 'IDLE') {
                state.animPhase = 'GLITCHING';
                state.phaseTimer = 3 + Math.random() * 5; // 爆发闪烁 3-8 帧
            } else {
                state.animPhase = 'IDLE';
                state.phaseTimer = 60 + Math.random() * 100; // 停顿 1-2 秒
            }
        }
        
        state.phaseTimer--;
        
        if (state.animPhase === 'GLITCHING') {
            draw();
        } else if (state.phaseTimer === 59) {
            // 刚进入 IDLE 时重绘一次静态帧
            draw();
        }
        
        requestAnimationFrame(loop);
    }

    // 交互
    canvas.onmousedown = e => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        state.strikes.push(createFracture(x, y));
        msg.innerText = `击中位置: ${Math.floor(x)}px`;
        draw();
    };

    document.getElementById('btnRandom').onclick = () => {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        state.strikes.push(createFracture(x, y));
        draw();
    };

    document.getElementById('btnClear').onclick = () => {
        state.strikes = [];
        draw();
    };

    // 启动
    draw();
    loop();
</script>

</body>
</html>
