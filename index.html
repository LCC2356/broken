<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>点击破裂屏幕效果</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1cff1c;
      cursor: crosshair;
    }

    #screen {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #1cff1c;
    }

    .tip {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", sans-serif;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.75);
      background: rgba(255, 255, 255, 0.65);
      border-radius: 8px;
      backdrop-filter: blur(2px);
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div class="tip">点击任意位置制造破裂（按 R 清空）</div>

  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');

    const cracks = [];
    let width = 0;
    let height = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.floor(window.innerWidth);
      height = Math.floor(window.innerHeight);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function makeCrack(cx, cy) {
      const rays = Math.floor(rand(10, 18));
      const rings = [
        rand(5, 10),
        rand(20, 36),
        rand(60, 95),
        rand(140, 220),
        rand(260, 420)
      ];

      const angles = [];
      for (let i = 0; i < rays; i++) {
        const base = (Math.PI * 2 * i) / rays;
        angles.push(base + rand(-0.14, 0.14));
      }
      angles.sort((a, b) => a - b);

      const pointsByRing = rings.map((radius, ringIdx) => {
        return angles.map((a) => {
          const jitter = ringIdx === 0 ? 0 : rand(0.9, 1.12);
          return {
            x: cx + Math.cos(a) * radius * jitter,
            y: cy + Math.sin(a) * radius * jitter
          };
        });
      });

      return {
        cx,
        cy,
        life: 1,
        angles,
        pointsByRing,
        shards: buildShards(pointsByRing),
        glitchSeeds: Array.from({ length: Math.floor(rand(12, 26)) }, () => ({
          x: rand(0, width),
          w: rand(1, 4),
          alpha: rand(0.18, 0.58),
          color: ['#ff2d2d', '#2d7dff', '#ffffff', '#00f0ff', '#ff00e6'][Math.floor(rand(0, 5))]
        }))
      };
    }

    function buildShards(pointsByRing) {
      const shards = [];
      for (let r = 0; r < pointsByRing.length - 1; r++) {
        const inner = pointsByRing[r];
        const outer = pointsByRing[r + 1];
        for (let i = 0; i < inner.length; i++) {
          const ni = (i + 1) % inner.length;
          const typeRoll = Math.random();
          const type = typeRoll > 0.72 ? 'glitch' : typeRoll > 0.45 ? 'dark' : 'clear';
          shards.push({
            type,
            poly: [inner[i], outer[i], outer[ni], inner[ni]],
            ring: r
          });
        }
      }
      return shards;
    }

    function drawShardTexture(shard) {
      const poly = shard.poly;
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;
      for (const p of poly) {
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
      }

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
      ctx.closePath();
      ctx.clip();

      if (shard.type === 'dark') {
        ctx.fillStyle = 'rgba(0,0,0,0.88)';
        ctx.fillRect(minX - 2, minY - 2, maxX - minX + 4, maxY - minY + 4);
      } else if (shard.type === 'glitch') {
        ctx.fillStyle = 'rgba(0,0,0,0.92)';
        ctx.fillRect(minX - 2, minY - 2, maxX - minX + 4, maxY - minY + 4);

        for (let x = minX; x <= maxX; x += rand(1, 4)) {
          if (Math.random() > 0.46) {
            const c = ['#ff2d2d', '#2d7dff', '#7dff2d', '#ffffff', '#ff00e6'][Math.floor(rand(0, 5))];
            ctx.fillStyle = c;
            const h = rand(height * 0.22, height * 0.9);
            const y = rand(0, height - h);
            ctx.fillRect(x + rand(-1, 1), y, rand(1, 3), h);
          }
        }

        // 横向故障扫描线
        for (let y = minY; y <= maxY; y += rand(2, 5)) {
          if (Math.random() > 0.65) {
            ctx.fillStyle = `rgba(255,255,255,${rand(0.06, 0.25)})`;
            ctx.fillRect(minX, y, maxX - minX, 1);
          }
        }
      } else {
        // clear: 玻璃高光纹理
        const grad = ctx.createLinearGradient(minX, minY, maxX, maxY);
        grad.addColorStop(0, 'rgba(255,255,255,0.02)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0.14)');
        grad.addColorStop(1, 'rgba(255,255,255,0.03)');
        ctx.fillStyle = grad;
        ctx.fillRect(minX - 2, minY - 2, maxX - minX + 4, maxY - minY + 4);
      }

      ctx.restore();
    }

    function drawCrackLines(crack) {
      const outer = crack.pointsByRing[crack.pointsByRing.length - 1];
      const inner = crack.pointsByRing[1];

      // 主放射裂纹
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.72)';
      ctx.beginPath();
      for (const p of outer) {
        ctx.moveTo(crack.cx, crack.cy);
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      // 次级蜘蛛网裂纹
      ctx.lineWidth = 0.7;
      ctx.strokeStyle = 'rgba(220,235,255,0.38)';
      ctx.beginPath();
      for (let i = 0; i < outer.length; i++) {
        const ni = (i + 1) % outer.length;
        if (Math.random() > 0.25) {
          ctx.moveTo(inner[i].x, inner[i].y);
          ctx.lineTo(outer[ni].x, outer[ni].y);
        }
      }
      ctx.stroke();

      // 冲击中心白点
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(crack.cx, crack.cy, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawGlobalGlitch(crack) {
      for (const seed of crack.glitchSeeds) {
        ctx.fillStyle = seed.color.replace(')', `, ${seed.alpha})`);
      }

      // 更稳定的全屏故障线（垂直）
      for (const seed of crack.glitchSeeds) {
        ctx.fillStyle = seed.color + Math.floor(seed.alpha * 255).toString(16).padStart(2, '0');
        ctx.fillRect(seed.x + rand(-2, 2), 0, seed.w, height);
      }
    }

    function render() {
      ctx.fillStyle = '#1cff1c';
      ctx.fillRect(0, 0, width, height);

      for (const crack of cracks) {
        for (const shard of crack.shards) drawShardTexture(shard);
        drawCrackLines(crack);
        drawGlobalGlitch(crack);
      }

      requestAnimationFrame(render);
    }

    canvas.addEventListener('pointerdown', (e) => {
      cracks.push(makeCrack(e.clientX, e.clientY));
      if (cracks.length > 12) cracks.shift();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r') cracks.length = 0;
    });

    window.addEventListener('resize', resize);
    resize();
    render();
  </script>
</body>
</html>
