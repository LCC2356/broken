<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>20:1 破裂屏幕效果</title>
  <style>
    :root {
      --bg: #18ff18;
      --panel: rgba(5, 5, 5, 0.65);
      --text: #e9ffe9;
      --accent: #63ff63;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020902;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", sans-serif;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      z-index: 2;
    }

    .title {
      font-weight: 700;
      font-size: 13px;
      margin-right: 4px;
      color: var(--accent);
      letter-spacing: 0.4px;
    }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .ctrl label {
      opacity: 0.92;
      font-size: 12px;
    }

    .ctrl input[type='range'] {
      width: 120px;
      accent-color: #6bff6b;
      cursor: pointer;
    }

    .ctrl .val {
      width: 40px;
      text-align: right;
      color: #afffaf;
      font-variant-numeric: tabular-nums;
    }

    button {
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-radius: 8px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: #6fff6f;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 16px;
      box-sizing: border-box;
    }

    canvas {
      width: min(98vw, calc((100vh - 90px) * 20));
      height: calc(min(98vw, calc((100vh - 90px) * 20)) / 20);
      background: var(--bg);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: crosshair;
    }

    .hint {
      margin-left: auto;
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <span class="title">BROKEN-SCREEN 20:1</span>
      <div class="ctrl">
        <label for="lineSize">故障线尺寸</label>
        <input id="lineSize" type="range" min="1" max="8" value="2" />
        <span class="val" id="lineSizeVal">2</span>
      </div>
      <div class="ctrl">
        <label for="lineDensity">故障线分布</label>
        <input id="lineDensity" type="range" min="5" max="100" value="45" />
        <span class="val" id="lineDensityVal">45%</span>
      </div>
      <button id="resetBtn">清空</button>
      <span class="hint">点击画板制造玻璃破裂 · 按 R 重置</span>
    </div>
    <div class="stage">
      <canvas id="screen"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const lineSizeEl = document.getElementById('lineSize');
    const lineDensityEl = document.getElementById('lineDensity');
    const lineSizeVal = document.getElementById('lineSizeVal');
    const lineDensityVal = document.getElementById('lineDensityVal');
    const resetBtn = document.getElementById('resetBtn');

    const cracks = [];
    let width = 0;
    let height = 0;
    let dpr = 1;

    const state = {
      bg: '#18ff18',
      glitchLineSize: Number(lineSizeEl.value),
      glitchDensity: Number(lineDensityEl.value) / 100,
      sharedLines: []
    };

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = Math.max(1, Math.floor(rect.width));
      height = Math.max(1, Math.floor(rect.height));
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      rebuildSharedGlitchLines();
    }

    function rebuildSharedGlitchLines() {
      const lines = [];
      const colors = ['#ff2b2b', '#2b7fff', '#ff00ef', '#00f7ff', '#ffffff', '#faff00'];
      const step = Math.max(1, state.glitchLineSize);
      for (let x = 0; x < width; x += step) {
        if (Math.random() < state.glitchDensity) {
          lines.push({
            x,
            w: Math.max(1, Math.round(step * rand(0.8, 1.8))),
            alpha: rand(0.18, 0.62),
            color: colors[Math.floor(rand(0, colors.length))]
          });
        }
      }
      state.sharedLines = lines;
    }

    function rgbaFromHex(hex, alpha) {
      const value = hex.replace('#', '');
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function makeGlassCrack(cx, cy) {
      const rays = Math.floor(rand(14, 24));
      const maxR = Math.min(width, height) * rand(0.38, 0.62);
      const ringCount = 4;

      const angles = [];
      let angle = rand(0, Math.PI * 2);
      for (let i = 0; i < rays; i++) {
        angle += (Math.PI * 2) / rays + rand(-0.08, 0.08);
        angles.push(angle);
      }

      const rings = [];
      for (let r = 1; r <= ringCount; r++) {
        const baseRadius = (maxR * r) / ringCount;
        rings.push(baseRadius);
      }

      const vertices = rings.map((radius, ringIdx) =>
        angles.map((a) => {
          const deform = ringIdx === 0 ? rand(0.9, 1.05) : rand(0.82, 1.2);
          const bend = Math.sin(a * 3 + ringIdx) * radius * 0.03;
          return {
            x: cx + Math.cos(a) * radius * deform + bend,
            y: cy + Math.sin(a) * radius * deform + bend * 0.35
          };
        })
      );

      const shards = [];
      for (let r = 0; r < vertices.length - 1; r++) {
        for (let i = 0; i < angles.length; i++) {
          const next = (i + 1) % angles.length;
          const pieceRoll = Math.random();
          const pieceType = pieceRoll > 0.72 ? 'void' : pieceRoll > 0.38 ? 'glitch' : 'glass';
          shards.push({
            poly: [vertices[r][i], vertices[r + 1][i], vertices[r + 1][next], vertices[r][next]],
            type: pieceType,
            ring: r
          });
        }
      }

      const branchCracks = [];
      angles.forEach((a, idx) => {
        const out = vertices[vertices.length - 1][idx];
        const branchLen = rand(14, 50);
        if (Math.random() > 0.25) {
          branchCracks.push({
            x1: out.x,
            y1: out.y,
            x2: out.x + Math.cos(a + rand(-0.65, 0.65)) * branchLen,
            y2: out.y + Math.sin(a + rand(-0.65, 0.65)) * branchLen,
            alpha: rand(0.2, 0.5)
          });
        }
      });

      return { cx, cy, angles, vertices, shards, branchCracks };
    }

    function clipPolygon(poly) {
      ctx.beginPath();
      ctx.moveTo(poly[0].x, poly[0].y);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
      ctx.closePath();
      ctx.clip();
    }

    function drawSharedGlitchLines() {
      for (const line of state.sharedLines) {
        ctx.fillStyle = rgbaFromHex(line.color, line.alpha);
        ctx.fillRect(line.x, 0, line.w, height);
      }
    }

    function drawShard(shard) {
      const poly = shard.poly;
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;
      for (const p of poly) {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
      }

      ctx.save();
      clipPolygon(poly);

      if (shard.type === 'void') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.94)';
        ctx.fillRect(minX - 2, minY - 2, maxX - minX + 4, maxY - minY + 4);
      } else if (shard.type === 'glitch') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.90)';
        ctx.fillRect(minX - 2, minY - 2, maxX - minX + 4, maxY - minY + 4);
        drawSharedGlitchLines();

        for (let y = minY; y <= maxY; y += rand(2, 5)) {
          if (Math.random() > 0.55) {
            ctx.fillStyle = `rgba(255,255,255,${rand(0.06, 0.25)})`;
            ctx.fillRect(minX, y, maxX - minX, 1);
          }
        }
      } else {
        const g = ctx.createLinearGradient(minX, minY, maxX, maxY);
        g.addColorStop(0, 'rgba(255,255,255,0.03)');
        g.addColorStop(0.45, 'rgba(255,255,255,0.20)');
        g.addColorStop(1, 'rgba(255,255,255,0.04)');
        ctx.fillStyle = g;
        ctx.fillRect(minX - 2, minY - 2, maxX - minX + 4, maxY - minY + 4);
      }

      ctx.restore();
    }

    function drawGlassLines(crack) {
      const outer = crack.vertices[crack.vertices.length - 1];
      const mid = crack.vertices[1];

      ctx.strokeStyle = 'rgba(240,245,255,0.78)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const p of outer) {
        ctx.moveTo(crack.cx, crack.cy);
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();

      ctx.strokeStyle = 'rgba(210,230,255,0.34)';
      ctx.lineWidth = 0.75;
      ctx.beginPath();
      for (let i = 0; i < outer.length; i++) {
        const next = (i + 1) % outer.length;
        if (Math.random() > 0.24) {
          ctx.moveTo(mid[i].x, mid[i].y);
          ctx.lineTo(outer[next].x, outer[next].y);
        }
      }
      ctx.stroke();

      // 环裂纹（更像玻璃冲击裂）
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 0.6;
      crack.vertices.forEach((ring, idx) => {
        if (idx === crack.vertices.length - 1) return;
        ctx.beginPath();
        ring.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.stroke();
      });

      // 外圈分支细裂纹
      ctx.strokeStyle = 'rgba(250,255,255,0.38)';
      ctx.lineWidth = 0.55;
      ctx.beginPath();
      crack.branchCracks.forEach((b) => {
        ctx.moveTo(b.x1, b.y1);
        ctx.lineTo(b.x2, b.y2);
      });
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(crack.cx, crack.cy, 1.7, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawGlobalGlitchOverlay() {
      drawSharedGlitchLines();
      for (let y = 0; y < height; y += 3) {
        if (Math.random() > 0.88) {
          ctx.fillStyle = `rgba(255,255,255,${rand(0.02, 0.08)})`;
          ctx.fillRect(0, y, width, 1);
        }
      }
    }

    function render() {
      ctx.fillStyle = state.bg;
      ctx.fillRect(0, 0, width, height);

      cracks.forEach((crack) => {
        crack.shards.forEach(drawShard);
        drawGlassLines(crack);
      });

      if (cracks.length) {
        drawGlobalGlitchOverlay();
      }

      requestAnimationFrame(render);
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      cracks.push(makeGlassCrack(x, y));
      if (cracks.length > 20) cracks.shift();
    });

    lineSizeEl.addEventListener('input', () => {
      state.glitchLineSize = Number(lineSizeEl.value);
      lineSizeVal.textContent = String(state.glitchLineSize);
      rebuildSharedGlitchLines();
    });

    lineDensityEl.addEventListener('input', () => {
      state.glitchDensity = Number(lineDensityEl.value) / 100;
      lineDensityVal.textContent = `${lineDensityEl.value}%`;
      rebuildSharedGlitchLines();
    });

    resetBtn.addEventListener('click', () => {
      cracks.length = 0;
    });

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r') cracks.length = 0;
    });

    window.addEventListener('resize', resizeCanvas);

    lineSizeVal.textContent = lineSizeEl.value;
    lineDensityVal.textContent = `${lineDensityEl.value}%`;
    resizeCanvas();
    render();
  </script>
</body>
</html>
