<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>互动屏幕故障实验室</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #eeeeee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 2vh 0;
            min-height: 100vh;
        }
        .container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        canvas {
            background-color: #050505;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            border: 2px solid #333;
            border-radius: 12px;
            cursor: crosshair; /* 提示可以点击 */
        }
        .control-panel {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .control-panel h3 {
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            margin-bottom: 5px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        select {
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 4px;
        }
        .hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="brokenScreen" width="380" height="680"></canvas>

    <div class="control-panel">
        <h3>控制台</h3>
        
        <div class="control-group">
            <label>故障强度 (Intensity) <span id="valIntensity">0.9</span></label>
            <input type="range" id="ctrlIntensity" min="0" max="1" step="0.05" value="0.9">
        </div>

        <div class="control-group">
            <label>条纹密度 (Density)</label>
            <select id="ctrlDensity">
                <option value="10">低</option>
                <option value="5">中</option>
                <option value="2" selected>高</option>
            </select>
        </div>

        <div class="control-group">
            <label>色调偏移 (Hue Shift) <span id="valHue">0</span></label>
            <input type="range" id="ctrlHue" min="0" max="360" step="1" value="0">
        </div>

        <div class="control-group">
            <label>裂纹 X 轴 <span id="valX">0.75</span></label>
            <input type="range" id="ctrlX" min="0" max="1" step="0.01" value="0.75">
        </div>

        <div class="control-group">
            <label>裂纹 Y 轴 <span id="valY">0.25</span></label>
            <input type="range" id="ctrlY" min="0" max="1" step="0.01" value="0.25">
        </div>

        <div class="hint">💡 提示：你可以直接点击左侧屏幕来砸出新的裂纹。</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('brokenScreen');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    // --- 状态变量 (映射控件) ---
    let state = {
        intensity: 0.9,
        density: 2,
        hueShift: 0,
        impactX: width * 0.75,
        impactY: height * 0.25
    };

    // --- 绑定控件事件 ---
    document.getElementById('ctrlIntensity').addEventListener('input', (e) => {
        state.intensity = parseFloat(e.target.value);
        document.getElementById('valIntensity').innerText = state.intensity.toFixed(2);
    });
    
    document.getElementById('ctrlDensity').addEventListener('change', (e) => {
        state.density = parseInt(e.target.value);
    });

    document.getElementById('ctrlHue').addEventListener('input', (e) => {
        state.hueShift = parseInt(e.target.value);
        document.getElementById('valHue').innerText = state.hueShift;
    });

    // X轴滑块更新
    const ctrlX = document.getElementById('ctrlX');
    ctrlX.addEventListener('input', (e) => {
        state.impactX = parseFloat(e.target.value) * width;
        document.getElementById('valX').innerText = e.target.value;
    });

    // Y轴滑块更新
    const ctrlY = document.getElementById('ctrlY');
    ctrlY.addEventListener('input', (e) => {
        state.impactY = parseFloat(e.target.value) * height;
        document.getElementById('valY').innerText = e.target.value;
    });

    // 画布点击事件：直接更新撞击点
    canvas.addEventListener('mousedown', (e) => {
        const rect = canvas.getBoundingClientRect();
        state.impactX = e.clientX - rect.left;
        state.impactY = e.clientY - rect.top;
        
        // 同步更新滑块 UI
        const normX = (state.impactX / width).toFixed(2);
        const normY = (state.impactY / height).toFixed(2);
        ctrlX.value = normX; document.getElementById('valX').innerText = normX;
        ctrlY.value = normY; document.getElementById('valY').innerText = normY;
    });

    // --- 绘图逻辑 ---

    function drawGlitchLines() {
        // 清理背景，留下轻微残影
        ctx.fillStyle = `rgba(0, 0, 0, ${1 - state.intensity * 0.5})`;
        ctx.fillRect(0, 0, width, height);

        // 基于密度参数控制线条数量
        for (let i = 0; i < width; i += (Math.random() * state.density + 1)) {
            // 基于强度决定是否绘制这条线
            if (Math.random() < state.intensity) {
                // 使用 HSL 颜色空间，方便进行色调偏移
                const baseHues = [0, 120, 240, 180, 300]; // 红绿蓝青洋红
                const randomHue = baseHues[Math.floor(Math.random() * baseHues.length)];
                const finalHue = (randomHue + state.hueShift) % 360;
                
                // 偶尔混入白色
                const isWhite = Math.random() > 0.8;
                ctx.fillStyle = isWhite ? 'white' : `hsl(${finalHue}, 100%, 50%)`;
                
                const lineWidth = Math.random() * 3 * state.intensity;
                ctx.globalAlpha = Math.random() * state.intensity;
                
                // 模拟画面撕裂：某些线条不贯穿整个屏幕
                const startY = Math.random() > 0.8 ? Math.random() * height : 0;
                const endY = Math.random() > 0.8 ? Math.random() * height : height;
                
                ctx.fillRect(i, startY, lineWidth, endY - startY);
            }
        }
        ctx.globalAlpha = 1.0;
    }

    // 绘制基于撞击点生成的漏液黑斑
    function drawDeadPixels() {
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        
        // 以撞击点为核心，向左下角蔓延的死像素区
        ctx.moveTo(state.impactX - 10, state.impactY + 10);
        ctx.lineTo(width, state.impactY - 30);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        
        // 动态计算边缘，使其看起来受到原点位置影响
        ctx.lineTo(0, state.impactY + 150);
        ctx.lineTo(state.impactX * 0.4, state.impactY + 80);
        ctx.lineTo(state.impactX * 0.6, state.impactY + 120);
        
        ctx.fill();
    }

    // 绘制基于撞击点的放射状裂纹
    function drawCracks() {
        ctx.strokeStyle = 'rgba(200, 255, 255, 0.6)';
        ctx.lineWidth = 1;

        // 固定一个随机种子以保持裂纹形状稳定，而不是每帧乱闪
        // 这里简化处理，通过固定算法生成伪随机
        for (let i = 0; i < 25; i++) {
            ctx.beginPath();
            ctx.moveTo(state.impactX, state.impactY);
            
            // 使用伪随机角度分布
            const angle = (i / 25) * Math.PI * 2 + (i % 3 * 0.1); 
            const length = (i % 5 + 1) * 80; // 不同长度的裂纹
            
            let currX = state.impactX;
            let currY = state.impactY;
            
            const segments = 4;
            for (let j = 0; j < segments; j++) {
                const segmentLength = length / segments;
                // 固定的偏移量计算方式
                const offsetX = Math.sin(i * j) * 15; 
                const offsetY = Math.cos(i * j) * 15;
                
                currX += Math.cos(angle) * segmentLength + offsetX;
                currY += Math.sin(angle) * segmentLength + offsetY;
                
                ctx.lineTo(currX, currY);
            }
            ctx.stroke();
        }
    }

    // 主循环
    function render() {
        drawGlitchLines();
        drawDeadPixels();
        drawCracks();
        
        // 使用 requestAnimationFrame 让动画更平滑
        // 通过 setTimeout 稍微降帧以模拟屏幕闪烁的滞后感
        setTimeout(() => {
            requestAnimationFrame(render);
        }, 50); 
    }

    // 启动
    render();

</script>
</body>
</html>
