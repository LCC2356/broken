<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO - 随机四边形切割版</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #111; color: #eee; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { background-color: #222; padding: 10px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #333; z-index: 10; }
        .control-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; border: 1px solid #222; }
        .control-group label { font-size: 10px; color: #888; text-transform: uppercase; }
        .control-group span { font-size: 10px; color: #74ff06; width: 30px; text-align: right; }
        input[type="range"] { cursor: pointer; width: 70px; accent-color: #74ff06; }
        button { background: #222; border: 1px solid #444; color: #fff; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: bold; }
        button:hover { border-color: #74ff06; color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #050505; padding: 20px; }
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div style="font-weight:900; font-size:14px; color:#fff; margin-right:10px">QUAD_FRACTURE_PRO</div>
        <div class="control-group">
            <label>故障概率</label>
            <input type="range" id="ctrlIntensity" min="0" max="100" value="85">
            <span id="valIntensity">85</span>
        </div>
        <div class="control-group">
            <label>线宽</label>
            <input type="range" id="ctrlLineWidth" min="1" max="10" value="2">
            <span id="valLineWidth">2</span>
        </div>
        <button id="btnClear">REBOOT SYSTEM</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas" width="2000" height="100"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        let state = {
            intensity: 0.85,
            lineWidth: 2,
            impactWidth: 200, 
            polygons: [] 
        };

        document.getElementById('ctrlIntensity').oninput = e => { state.intensity = e.target.value / 100; document.getElementById('valIntensity').innerText = e.target.value; };
        document.getElementById('ctrlLineWidth').oninput = e => { state.lineWidth = parseInt(e.target.value); document.getElementById('valLineWidth').innerText = e.target.value; };
        document.getElementById('btnClear').onclick = init;

        class Polygon {
            constructor(points, type = 'none') {
                this.points = points; 
                this.type = type; 
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.points[0][0], this.points[0][1]);
                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i][0], this.points[i][1]);
                }
                ctx.closePath();

                if (this.type === 'black') {
                    ctx.fillStyle = '#000';
                    ctx.fill();
                } else if (this.type === 'glitch') {
                    ctx.clip();
                    ctx.fillStyle = '#000';
                    ctx.fill();
                    this.drawGlitchLines();
                }

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                ctx.restore();
            }

            drawGlitchLines() {
                let minX = Infinity, maxX = -Infinity;
                this.points.forEach(p => { if(p[0] < minX) minX = p[0]; if(p[0] > maxX) maxX = p[0]; });
                const colors = ['#FF0033', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
                for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += state.lineWidth) {
                    if (Math.random() < 0.8) {
                        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                        ctx.fillRect(x, 0, state.lineWidth, canvas.height); 
                    }
                }
            }
        }

        function init() {
            state.polygons = [
                new Polygon([[0, 0], [canvas.width, 0], [canvas.width, canvas.height], [0, canvas.height]])
            ];
        }

        function isPointInPoly(pt, poly) {
            let x = pt[0], y = pt[1];
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i][0], yi = poly[i][1];
                let xj = poly[j][0], yj = poly[j][1];
                let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        /**
         * 核心：斜向切割函数
         * xBase: 直线在 my 高度时的 x 坐标
         * angleDeg: 偏离垂直线的角度 (度)
         */
        function sliceByAngledLine(polyPoints, xBase, my, angleDeg) {
            let left = [], right = [];
            const angleRad = angleDeg * Math.PI / 180;
            const tanA = Math.tan(angleRad);

            // 直线方程: x = xBase + (y - my) * tanA
            const getSide = (p) => {
                const lineX = xBase + (p[1] - my) * tanA;
                return p[0] - lineX;
            };

            for (let i = 0; i < polyPoints.length; i++) {
                let p1 = polyPoints[i];
                let p2 = polyPoints[(i + 1) % polyPoints.length];

                let side1 = getSide(p1);
                let side2 = getSide(p2);

                if (side1 < 0) left.push(p1);
                else right.push(p1);

                if ((side1 < 0 && side2 >= 0) || (side1 >= 0 && side2 < 0)) {
                    // 求交点
                    // 解方程组：
                    // 1. x = p1.x + t * (p2.x - p1.x)
                    // 2. y = p1.y + t * (p2.y - p1.y)
                    // 3. x = xBase + (y - my) * tanA
                    
                    const dx = p2[0] - p1[0];
                    const dy = p2[1] - p1[1];
                    // 代入：p1.x + t*dx = xBase + (p1.y + t*dy - my) * tanA
                    // t * (dx - dy * tanA) = xBase - p1.x + (p1.y - my) * tanA
                    const t = (xBase - p1[0] + (p1[1] - my) * tanA) / (dx - dy * tanA);
                    
                    const ix = p1[0] + t * dx;
                    const iy = p1[1] + t * dy;
                    left.push([ix, iy]);
                    right.push([ix, iy]);
                }
            }
            return [left, right];
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);

            // 随机生成 30-45 度的左右边界角
            const angleLeft = 30 + Math.random() * 15;   // 30~45 度
            const angleRight = -(30 + Math.random() * 15); // -30~-45 度

            const xLeftBase = mx - state.impactWidth / 2;
            const xRightBase = mx + state.impactWidth / 2;

            for (let i = state.polygons.length - 1; i >= 0; i--) {
                const target = state.polygons[i];
                if (isPointInPoly([mx, my], target.points)) {
                    
                    // 1. 先切出左侧
                    let [part1, partRest] = sliceByAngledLine(target.points, xLeftBase, my, angleLeft);
                    
                    if (part1.length > 2 && partRest.length > 2) {
                        // 2. 在剩余部分切出右侧
                        let [centerQuad, part2] = sliceByAngledLine(partRest, xRightBase, my, angleRight);
                        
                        if (centerQuad.length > 2) {
                            // 碎裂中间的不规则四边形区域
                            shatter(centerQuad, mx, my);
                            
                            state.polygons.splice(i, 1);
                            if (part1.length > 2) state.polygons.push(new Polygon(part1, 'none'));
                            if (part2.length > 2) state.polygons.push(new Polygon(part2, 'none'));
                        } else {
                            shatter(target.points, mx, my, i);
                        }
                    } else {
                        shatter(target.points, mx, my, i);
                    }
                    break;
                }
            }
        });

        function shatter(points, mx, my, index = -1) {
            const newPolys = [];
            for (let i = 0; i < points.length; i++) {
                const p1 = points[i];
                const p2 = points[(i + 1) % points.length];
                
                const ratio = 0.2 + Math.random() * 0.6;
                const edgeX = p1[0] + (p2[0] - p1[0]) * ratio;
                const edgeY = p1[1] + (p2[1] - p1[1]) * ratio;

                const type1 = Math.random() < state.intensity ? (Math.random() > 0.4 ? 'glitch' : 'black') : 'none';
                newPolys.push(new Polygon([p1, [edgeX, edgeY], [mx, my]], type1));

                const type2 = Math.random() < state.intensity * 0.4 ? 'black' : 'none';
                newPolys.push(new Polygon([[edgeX, edgeY], p2, [mx, my]], type2));
            }

            if (index !== -1) state.polygons.splice(index, 1, ...newPolys);
            else state.polygons.push(...newPolys);
        }

        function render() {
            ctx.fillStyle = '#74ff06';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            state.polygons.forEach(p => p.draw());
            requestAnimationFrame(render);
        }

        init();
        render();
    </script>
</body>
</html>
