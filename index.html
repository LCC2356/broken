<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO v8.4 - 8.0回归稳定性版</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #111; color: #eee; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { background-color: #222; padding: 10px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #000; z-index: 10; flex-wrap: wrap; }
        .branding { font-weight: 900; font-size: 14px; color: #fff; margin-right: 10px; letter-spacing: 1px; border-right: 1px solid #444; padding-right: 15px;}
        
        .control-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; border: 1px solid #333; }
        .control-group label { font-size: 10px; color: #888; text-transform: uppercase; }
        .control-group span { font-size: 10px; color: #74ff06; width: 25px; text-align: right; font-family: monospace; }
        
        /* 数值输入框样式 */
        input[type="number"] { background: #000; border: 1px solid #444; color: #74ff06; font-size: 11px; width: 40px; padding: 2px 5px; outline: none; border-radius: 2px; }
        input[type="number"]:focus { border-color: #74ff06; }
        input[type="range"] { cursor: pointer; width: 60px; accent-color: #74ff06; }
        
        .switch-group { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #888; text-transform: uppercase; }
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 18px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #74ff06; }
        input:checked + .slider:before { transform: translateX(16px); }

        button { background: #333; border: 1px solid #555; color: #fff; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: bold; }
        button:hover { border-color: #74ff06; color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #050505; padding: 20px; }
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE_v8.4</div>
        
        <div class="control-group">
            <label>故障线宽</label>
            <input type="number" id="ctrlLineWidth" value="1" min="0" max="100">
        </div>

        <div class="control-group">
            <label>密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" value="70">
            <span id="valDensity">70</span>
        </div>

        <div class="control-group">
            <label>动态速度</label>
            <input type="range" id="ctrlSpeed" min="0" max="100" value="50">
            <span id="valSpeed">50</span>
        </div>

        <div class="switch-group">
            <label>原位闪烁</label>
            <label class="switch">
                <input type="checkbox" id="ctrlDynamic" checked>
                <span class="slider"></span>
            </label>
        </div>
        
        <button id="btnClear" style="margin-left: auto;">REBOOT</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas" width="2000" height="100"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        let state = {
            density: 0.7,
            lineWidth: 1,
            speed: 0.5,
            isDynamic: true,
            impactWidth: 160,
            polygons: [] 
        };

        // UI 绑定
        document.getElementById('ctrlDensity').oninput = e => { state.density = e.target.value / 100; document.getElementById('valDensity').innerText = e.target.value; };
        document.getElementById('ctrlLineWidth').onchange = e => { state.lineWidth = parseInt(e.target.value) || 0; };
        document.getElementById('ctrlSpeed').oninput = e => { state.speed = e.target.value / 100; document.getElementById('valSpeed').innerText = e.target.value; };
        document.getElementById('ctrlDynamic').onchange = e => { state.isDynamic = e.target.checked; };
        document.getElementById('btnClear').onclick = init;

        class Polygon {
            constructor(points, type = 'base', seed = null) {
                this.points = points; 
                this.type = type; 
                this.seed = seed !== null ? seed : Math.random();
            }

            getArea() {
                let area = 0;
                for (let i = 0; i < this.points.length; i++) {
                    let j = (i + 1) % this.points.length;
                    area += this.points[i][0] * this.points[j][1] - this.points[j][0] * this.points[i][1];
                }
                return Math.abs(area) / 2;
            }

            draw() {
                if (this.points.length < 3) return;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.points[0][0], this.points[0][1]);
                for (let i = 1; i < this.points.length; i++) ctx.lineTo(this.points[i][0], this.points[i][1]);
                ctx.closePath();

                if (this.type === 'base') {
                    ctx.fillStyle = '#74ff06'; ctx.fill();
                } else {
                    ctx.fillStyle = '#000'; ctx.fill();
                    if (this.type === 'glitch' && state.lineWidth > 0) {
                        ctx.save(); ctx.clip();
                        this.drawGlitchLines();
                        this.drawInnerGradient();
                        ctx.restore();
                    }
                }

                if (this.type !== 'base') {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawInnerGradient() {
                let cx = 0, cy = 0; this.points.forEach(p => { cx += p[0]; cy += p[1]; });
                cx /= this.points.length; cy /= this.points.length;
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0.25)');
                ctx.fillStyle = grad; ctx.fill();
            }

            drawGlitchLines() {
                let minX = 2000, maxX = 0;
                this.points.forEach(p => { if(p[0] < minX) minX = p[0]; if(p[0] > maxX) maxX = p[0]; });
                const colors = ['#FF0033', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
                const w = Math.max(1, state.lineWidth);
                for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += w) {
                    const noise = this.absRandom(x, this.seed);
                    if (noise < state.density) {
                        // 💎 结合动态速度控制
                        if (state.isDynamic) {
                            // 使用当前时间结合速度值
                            const timeFactor = Date.now() * state.speed * 0.01;
                            const flicker = (Math.sin(x + timeFactor) + 1) / 2;
                            if (flicker < 0.2) continue; // 模拟由于速度产生的跳动
                            if (flicker < 0.5) ctx.globalAlpha = 0.4;
                        }
                        ctx.fillStyle = colors[Math.floor(noise * colors.length * 13) % colors.length];
                        ctx.fillRect(x, 0, w, canvas.height); 
                        ctx.globalAlpha = 1.0;
                    }
                }
            }

            absRandom(x, s) {
                let val = Math.sin(x * 12.9898 + s * 78.233) * 43758.5453;
                return val - Math.floor(val);
            }
        }

        function generatePolyline(xBase, my, angleDeg) {
            const path = [];
            const segments = 3; 
            const h = canvas.height;
            const tanA = Math.tan(angleDeg * Math.PI / 180);
            for (let i = 0; i <= segments; i++) {
                const y = (h / segments) * i;
                const x = xBase + (y - my) * tanA + (Math.random() - 0.5) * 15;
                path.push([x, y]);
            }
            return path;
        }

        function sliceByPolyline(polyPoints, path) {
            let left = [], right = [];
            const getXAtY = (y) => {
                for (let i = 0; i < path.length - 1; i++) {
                    if (y >= path[i][1] && y <= path[i+1][1]) {
                        const t = (y - path[i][1]) / (path[i+1][1] - path[i][1]);
                        return path[i][0] + t * (path[i+1][0] - path[i][0]);
                    }
                }
                return path[0][0];
            };
            const getSide = (p) => p[0] - getXAtY(p[1]);
            for (let i = 0; i < polyPoints.length; i++) {
                let p1 = polyPoints[i], p2 = polyPoints[(i + 1) % polyPoints.length];
                let s1 = getSide(p1), s2 = getSide(p2);
                if (s1 < 0) left.push(p1); else right.push(p1);
                if ((s1 < 0 && s2 >= 0) || (s1 >= 0 && s2 < 0)) {
                    let d = Math.abs(s1) + Math.abs(s2);
                    let t = d < 0.001 ? 0.5 : Math.abs(s1) / d;
                    let iy = p1[1] + (p2[1] - p1[1]) * t;
                    let ix = getXAtY(iy);
                    left.push([ix, iy]); right.push([ix, iy]);
                }
            }
            return [left, right];
        }

        function init() {
            state.polygons = [new Polygon([[0, 0], [canvas.width, 0], [canvas.width, canvas.height], [0, canvas.height]], 'base', null)];
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);

            // 1. 生成全局冲击带 (8.0 原版逻辑)
            const angL = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 15);
            const angR = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 15);
            const xL = mx - (40 + Math.random() * 50);
            const xR = mx + (40 + Math.random() * 50);
            const pathL = generatePolyline(xL, my, angL);
            const pathR = generatePolyline(xR, my, angR);

            let nextPolygons = [];
            const currentImpactSeed = Math.random();

            state.polygons.forEach(target => {
                // 性能保护
                let centerX = 0; target.points.forEach(p => centerX += p[0]); centerX /= target.points.length;
                if (Math.abs(centerX - mx) > 400) { nextPolygons.push(target); return; }

                let [pLeft, pRest] = sliceByPolyline(target.points, pathL);
                if (pRest.length > 2) {
                    let [pMid, pRight] = sliceByPolyline(pRest, pathR);
                    if (pMid.length > 2) {
                        // 💎 核心修改：在冲击中心增加 10px 的抖动偏移，防止顶点全部坍塌至一点
                        nextPolygons.push(...shatterToTriangles(pMid, mx, my, currentImpactSeed));
                    }
                    if (pLeft.length > 2) nextPolygons.push(new Polygon(pLeft, target.type, target.seed));
                    if (pRight.length > 2) nextPolygons.push(new Polygon(pRight, target.type, target.seed));
                } else {
                    if (pLeft.length > 2) nextPolygons.push(new Polygon(pLeft, target.type, target.seed));
                }
            });

            // 限制最大多边形数以防卡顿
            if (nextPolygons.length < 1000) {
                state.polygons = nextPolygons.filter(p => p.getArea() > 0.2);
            }
        });

        function shatterToTriangles(points, mx, my, impactSeed) {
            const results = [];
            // 💎 核心修复：为每个碎片组生成独立的微小偏移中心，打破“死结”
            const jitterX = mx + (Math.random() - 0.5) * 15;
            const jitterY = my + (Math.random() - 0.5) * 15;

            for (let i = 0; i < points.length; i++) {
                const p1 = points[i], p2 = points[(i + 1) % points.length];
                const r = 0.3 + Math.random() * 0.4;
                const mid = [p1[0] + (p2[0]-p1[0])*r, p1[1] + (p2[1]-p1[1])*r];

                const type1 = Math.random() < 0.65 ? 'glitch' : 'black';
                const type2 = Math.random() < 0.35 ? 'glitch' : 'black';
                const getSeed = () => Math.random() < 0.5 ? impactSeed : Math.random();
                
                results.push(new Polygon([p1, mid, [jitterX, jitterY]], type1, getSeed()));
                results.push(new Polygon([mid, p2, [jitterX, jitterY]], type2, getSeed()));
            }
            return results;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            state.polygons.forEach(p => p.draw());
            requestAnimationFrame(render);
        }

        init(); render();
    </script>
</body>
</html>
