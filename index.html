<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE_ENGINE_V4.0</title>
    <style>
        /* MICRO GRAPHICS DESIGN 风格 - 纯黑白、模块化、等宽字体 */
        :root {
            --bg: #000000;
            --fg: #ffffff;
            --border: #333333;
            --highlight: #00ff00;
            --font: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* 顶部导航与数据展示 */
        .header {
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            align-items: center;
        }

        .branding { font-weight: bold; letter-spacing: 2px; }
        .live-data { text-align: center; color: #666; }

        /* 模块化控制区 */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            border-bottom: 1px solid var(--border);
            background: #050505;
        }

        .control-box {
            padding: 15px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-box:last-child { border-right: none; }
        .control-box h4 { margin: 0 0 5px 0; color: #888; font-size: 10px; }

        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="number"], select {
            background: #000;
            border: 1px solid #444;
            color: var(--highlight);
            font-family: var(--font);
            padding: 3px 5px;
            width: 60px;
            outline: none;
        }

        input[type="range"] {
            flex: 1;
            margin-left: 10px;
            accent-color: var(--fg);
        }

        button {
            background: transparent;
            border: 1px solid var(--fg);
            color: var(--fg);
            font-family: var(--font);
            padding: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: var(--fg); color: var(--bg); }
        button.danger { border-color: #ff3333; color: #ff3333; }
        button.danger:hover { background: #ff3333; color: #fff; }

        /* 画布工作区 */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(#111 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .canvas-frame {
            border: 1px solid var(--fg);
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        canvas {
            display: block;
            background-color: #00ff00;
            cursor: crosshair;
        }

        .footer {
            padding: 5px 20px;
            border-top: 1px solid var(--border);
            font-size: 10px;
            color: #555;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="branding">FRACTURE_V4.0</div>
    <div class="live-data" id="monitor">MONITOR: IDLE // STATUS: READY</div>
    <div style="text-align: right;">EST. TIME: 0h:00m:00s</div>
</div>

<div class="controls-grid">
    <div class="control-box">
        <h4>物理形状 (SHAPE)</h4>
        <select id="shape">
            <option value="radial">RADIAL_CLASSIC</option>
            <option value="shattered">SHATTERED_HARD</option>
            <option value="web">WEB_DENSE</option>
        </select>
    </div>
    <div class="control-box">
        <h4>影响半径 (RADIUS)</h4>
        <div class="input-row">
            <label>PX</label>
            <input type="number" id="radius" value="250" min="50" max="1000">
        </div>
    </div>
    <div class="control-box">
        <h4>故障线宽 (WIDTH)</h4>
        <div class="input-row">
            <label>PX</label>
            <input type="number" id="lineWidth" value="1" min="1" max="20">
        </div>
    </div>
    <div class="control-box">
        <h4>聚集度 (CLUSTERING)</h4>
        <div class="input-row">
            <input type="range" id="clustering" min="0" max="1" step="0.1" value="0.7">
        </div>
    </div>
    <div class="control-box">
        <h4>操作 (ACTIONS)</h4>
        <div style="display: flex; gap: 5px;">
            <button id="btnRandom">随机砸击</button>
            <button id="btnClear" class="danger">清空</button>
        </div>
    </div>
</div>

<div class="workspace">
    <div class="canvas-frame">
        <canvas id="cvs" width="2000" height="100"></canvas>
    </div>
</div>

<div class="footer">
    <span>SCALE: 20:1 // REFRESH: 24FPS</span>
    <span id="strikeStats">STRIKES: 00</span>
</div>

<script>
    const canvas = document.getElementById('cvs');
    const ctx = canvas.getContext('2d');
    const monitor = document.getElementById('monitor');
    
    let state = {
        radius: 250,
        lineWidth: 1,
        clustering: 0.7,
        shape: 'radial',
        strikes: [],
        animTimer: 0,
        isGlitching: false
    };

    // 绑定数值输入
    document.getElementById('radius').oninput = e => state.radius = parseInt(e.target.value);
    document.getElementById('lineWidth').oninput = e => state.lineWidth = parseInt(e.target.value);
    document.getElementById('clustering').oninput = e => state.clustering = parseFloat(e.target.value);
    document.getElementById('shape').onchange = e => state.shape = e.target.value;

    function generateFracture(x, y) {
        const shards = [];
        const rays = state.shape === 'web' ? 20 : 12;
        const rings = state.shape === 'shattered' ? 4 : 7;
        
        const angles = [];
        for(let i=0; i<rays; i++) {
            angles.push((Math.PI*2/rays)*i + (Math.random()*0.4-0.2));
        }
        angles.sort();

        const rSteps = [];
        for(let r=0; r<rings; r++) {
            // 根据半径设置分布
            rSteps.push((r/rings) * state.radius * (0.8 + Math.random()*0.4));
        }
        rSteps.push(state.radius * 2.5); // 最后一圈大碎片

        const vertices = [];
        rSteps.forEach(r => {
            const row = [];
            angles.forEach(a => {
                row.push({
                    x: x + Math.cos(a)*r,
                    y: y + Math.sin(a)*r
                });
            });
            vertices.push(row);
        });

        for(let r=0; r<vertices.length-1; r++) {
            for(let a=0; a<rays; a++) {
                const nA = (a + 1) % rays;
                const poly = [vertices[r][a], vertices[r+1][a], vertices[r+1][nA], vertices[r][nA]];
                
                const rand = Math.random();
                let type = 'none';

                // 核心区域（r<=1）
                if (r <= 1) {
                    // 中心随机故障线要求：核心区域不再全是黑色，随机出现故障
                    type = rand < 0.3 ? 'glitchLines' : 'black'; 
                } else if (r <= 4) {
                    type = rand < 0.6 ? 'glitchLines' : 'none';
                }

                shards.push({ poly, type });
            }
        }
        return { x, y, shards };
    }

    function render() {
        // 1. 绿幕背景
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const colors = ['#ff0000', '#0000ff', '#ff00ff', '#00ffff', '#ffffff', '#ffff00'];

        state.strikes.forEach(s => {
            s.shards.forEach(shard => {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(shard.poly[0].x, shard.poly[0].y);
                shard.poly.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.closePath();
                ctx.clip();

                if (shard.type === 'black') {
                    ctx.fillStyle = '#000';
                    ctx.fill();
                } else if (shard.type === 'glitchLines') {
                    ctx.fillStyle = '#000'; ctx.fill();
                    // 在碎片内画 1px 贯穿线
                    for(let x=0; x<canvas.width; x+=state.lineWidth) {
                        const cluster = Math.sin(x * 0.1) * state.clustering;
                        if (Math.random() > 0.5 + cluster) {
                            ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
                            ctx.fillRect(x, 0, state.lineWidth, canvas.height);
                        }
                    }
                }
                ctx.restore();
            });

            // 玻璃裂缝线
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 0.5;
            s.shards.forEach(shard => {
                ctx.beginPath();
                ctx.moveTo(shard.poly[0].x, shard.poly[0].y);
                shard.poly.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            });
        });
    }

    // 节奏控制
    function loop() {
        state.animTimer--;
        if (state.animTimer <= 0) {
            state.isGlitching = !state.isGlitching;
            state.animTimer = state.isGlitching ? (2 + Math.random()*5) : (40 + Math.random()*60);
            monitor.innerText = state.isGlitching ? "MONITOR: GLITCH_BURST // 010101" : "MONITOR: STABLE // SCANNING...";
        }

        if (state.isGlitching) render();
        requestAnimationFrame(loop);
    }

    canvas.onmousedown = e => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        state.strikes.push(generateFracture(x, y));
        document.getElementById('strikeStats').innerText = "STRIKES: " + state.strikes.length.toString().padStart(2, '0');
        render();
    };

    document.getElementById('btnRandom').onclick = () => {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        state.strikes.push(generateFracture(x, y));
        render();
    };

    document.getElementById('btnClear').onclick = () => {
        state.strikes = [];
        render();
    };

    loop();
</script>
</body>
</html>
