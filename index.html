<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO v4.0 - Voronoi Logic</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #000; color: #eee; font-family: 'Courier New', monospace; overflow: hidden; }
        .toolbar { background-color: #111; padding: 10px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid #333; }
        .control-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; border: 1px solid #222; }
        .control-group label { font-size: 10px; color: #666; }
        .control-group span { font-size: 10px; color: #74ff06; width: 30px; text-align: right; }
        input[type="range"] { cursor: pointer; width: 60px; accent-color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; height: calc(100vh - 60px); }
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; box-shadow: 0 0 50px rgba(116, 255, 6, 0.1); }
    </style>
</head>
<body>

    <div class="toolbar">
        <div style="font-weight:900; font-size:14px; color:#fff;">VORONOI_FRACTURE</div>
        <div class="control-group">
            <label>碎片细度</label>
            <input type="range" id="ctrlDensity" min="10" max="150" value="60">
            <span id="valDensity">60</span>
        </div>
        <div class="control-group">
            <label>故障强度</label>
            <input type="range" id="ctrlIntensity" min="1" max="100" value="80">
            <span id="valIntensity">80</span>
        </div>
        <button id="btnClear" style="background:#222; border:1px solid #444; color:#fff; padding:5px 15px; cursor:pointer; font-size:10px;">RESET_SYSTEM</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas" width="2000" height="100"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        let state = {
            density: 60, // 种子点数量
            intensity: 0.8,
            strikes: [] 
        };

        document.getElementById('ctrlDensity').oninput = e => { state.density = parseInt(e.target.value); document.getElementById('valDensity').innerText = e.target.value; };
        document.getElementById('ctrlIntensity').oninput = e => { state.intensity = e.target.value / 100; document.getElementById('valIntensity').innerText = e.target.value; };
        document.getElementById('btnClear').onclick = () => state.strikes = [];

        // 模拟 Voronoi 碎裂算法
        function generateVoronoiShatter(originX, originY) {
            const points = [];
            const numPoints = state.density;
            const radius = 150; // 影响范围

            // 1. 生成基于中心抖动的种子点
            for(let i=0; i<numPoints; i++) {
                const angle = Math.random() * Math.PI * 2;
                // 使用平方根分布让点更集中在中心
                const dist = Math.sqrt(Math.random()) * radius; 
                points.push({
                    x: originX + Math.cos(angle) * dist * 0.8, // X 轴略微压缩
                    y: originY + Math.sin(angle) * dist * 1.5, // Y 轴拉伸以填满 100px
                    id: i
                });
            }

            // 2. 简化的碎片多边形逻辑：基于网格的三角剖分模拟
            // 这里我们为每个点生成一个小型的凸包碎片
            const shards = points.map(p => {
                const poly = [];
                const sides = 5 + Math.floor(Math.random() * 3);
                const pRadius = 5 + Math.random() * 20;
                for(let j=0; j<sides; j++) {
                    const a = (Math.PI * 2 / sides) * j + Math.random() * 0.5;
                    poly.push({
                        x: p.x + Math.cos(a) * pRadius,
                        y: p.y + Math.sin(a) * pRadius
                    });
                }
                
                // 判定损坏类型
                let type = 'none';
                const dToCenter = Math.abs(p.x - originX);
                if (dToCenter < 15) type = 'black'; // 核心黑屏区
                else if (Math.random() < state.intensity) type = 'glitch'; // 故障信号区

                return { polygon: poly, type, center: p };
            });

            return { x: originX, y: originY, shards };
        }

        function drawGlitchLines(shard) {
            let minX = 2000, maxX = 0;
            shard.polygon.forEach(p => { if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x; });
            
            const colors = ['#FF0000', '#0000FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
            const stripeWidth = 2;
            
            for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += stripeWidth) {
                if (Math.random() < 0.8) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillRect(x, 0, stripeWidth, canvas.height); 
                }
            }
        }

        function render() {
            // 亮绿色背景
            ctx.fillStyle = '#74ff06';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            state.strikes.forEach(strike => {
                // 1. 绘制故障信号 (在最底层)
                strike.shards.forEach(shard => {
                    if (shard.type === 'glitch') {
                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                        for(let i=1; i<shard.polygon.length; i++) ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                        ctx.closePath();
                        ctx.clip();
                        
                        ctx.fillStyle = '#000';
                        ctx.fill();
                        drawGlitchLines(shard);
                        ctx.restore();
                    }
                });

                // 2. 绘制核心黑屏区
                strike.shards.forEach(shard => {
                    if (shard.type === 'black') {
                        ctx.beginPath();
                        ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                        for(let i=1; i<shard.polygon.length; i++) ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                        ctx.closePath();
                        ctx.fillStyle = '#000';
                        ctx.fill();
                    }
                });

                // 3. 绘制物理裂纹线 (最顶层)
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 0.5;
                strike.shards.forEach(shard => {
                    ctx.beginPath();
                    ctx.moveTo(shard.polygon[0].x, shard.polygon[0].y);
                    for(let i=1; i<shard.polygon.length; i++) ctx.lineTo(shard.polygon[i].x, shard.polygon[i].y);
                    ctx.closePath();
                    ctx.stroke();
                });
            });

            requestAnimationFrame(render);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            state.strikes.push(generateVoronoiShatter(x, y));
        });

        render();
    </script>
</body>
</html>
