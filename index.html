<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FRACTURE PRO - 深度故障动态版</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: #111; color: #eee; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .toolbar { background-color: #222; padding: 10px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #333; z-index: 10; flex-wrap: wrap; }
        .branding { font-weight: 900; font-size: 14px; color: #fff; margin-right: 10px; letter-spacing: 1px; border-right: 1px solid #444; padding-right: 15px;}
        .control-group { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 5px 10px; border-radius: 4px; border: 1px solid #222; }
        .control-group label { font-size: 10px; color: #888; text-transform: uppercase; }
        .control-group span { font-size: 10px; color: #74ff06; width: 25px; text-align: right; font-family: monospace; }
        input[type="range"] { cursor: pointer; width: 60px; accent-color: #74ff06; }
        
        /* 开关样式 */
        .switch-group { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #888; text-transform: uppercase; margin-left: 10px;}
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 18px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #74ff06; }
        input:checked + .slider:before { transform: translateX(16px); }

        button { background: #333; border: 1px solid #555; color: #fff; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 10px; font-weight: bold; }
        button:hover { border-color: #74ff06; color: #74ff06; }
        .workspace { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #050505; padding: 20px; }
        canvas { background-color: #74ff06; cursor: crosshair; image-rendering: pixelated; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="branding">FRACTURE_v5.0</div>
        
        <div class="control-group">
            <label>线宽</label>
            <input type="range" id="ctrlLineWidth" min="1" max="15" value="2">
            <span id="valLineWidth">2</span>
        </div>

        <div class="control-group">
            <label>疏密度</label>
            <input type="range" id="ctrlDensity" min="1" max="100" value="75">
            <span id="valDensity">75</span>
        </div>

        <div class="switch-group">
            <label>动态信号</label>
            <label class="switch">
                <input type="checkbox" id="ctrlDynamic" checked>
                <span class="slider"></span>
            </label>
        </div>
        
        <button id="btnClear" style="margin-left: auto;">REBOOT</button>
    </div>

    <div class="workspace">
        <canvas id="mainCanvas" width="2000" height="100"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        let state = {
            density: 0.75,
            lineWidth: 2,
            impactWidth: 220,
            isDynamic: true,
            polygons: [] 
        };

        // UI 绑定
        document.getElementById('ctrlDensity').oninput = e => { state.density = e.target.value / 100; document.getElementById('valDensity').innerText = e.target.value; };
        document.getElementById('ctrlLineWidth').oninput = e => { state.lineWidth = parseInt(e.target.value); document.getElementById('valLineWidth').innerText = e.target.value; };
        document.getElementById('ctrlDynamic').onchange = e => { state.isDynamic = e.target.checked; };
        document.getElementById('btnClear').onclick = init;

        class Polygon {
            constructor(points, type = 'base') {
                this.points = points; 
                this.type = type; // 'base' (绿色), 'black' (纯黑), 'glitch' (黑底+线)
                this.seed = Math.random(); // 静态模式下的随机种子
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.points[0][0], this.points[0][1]);
                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i][0], this.points[i][1]);
                }
                ctx.closePath();

                if (this.type === 'base') {
                    ctx.fillStyle = '#74ff06';
                    ctx.fill();
                } else {
                    // 只要是被切开的区域，底色全是黑
                    ctx.fillStyle = '#000';
                    ctx.fill();
                    
                    if (this.type === 'glitch') {
                        ctx.clip();
                        this.drawGlitchLines();
                    }
                }

                // 只有被切开的部分显示白色的物理裂缝线
                if (this.type !== 'base') {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
                ctx.restore();
            }

            drawGlitchLines() {
                let minX = Infinity, maxX = -Infinity;
                this.points.forEach(p => { if(p[0] < minX) minX = p[0]; if(p[0] > maxX) maxX = p[0]; });
                
                const colors = ['#FF0033', '#0044FF', '#FF00FF', '#00FFFF', '#FFFFFF', '#FFFF00', '#000000'];
                const w = state.lineWidth;
                
                // 如果是静态模式，使用固定的随机种子
                let randomFunc = state.isDynamic ? Math.random : this.pseudoRandom(this.seed);

                for (let x = Math.floor(minX); x <= Math.ceil(maxX); x += w) {
                    if (randomFunc() < state.density) {
                        ctx.fillStyle = colors[Math.floor(randomFunc() * colors.length)];
                        // 加入微小的 X 轴抖动
                        const xOffset = (randomFunc() - 0.5) * 5; 
                        ctx.fillRect(x + xOffset, 0, w, canvas.height); 
                    }
                }
            }

            // 伪随机生成器，用于静态模式
            pseudoRandom(s) {
                let mask = 0xffffffff;
                let m_w = (123456789 + s * 10000) & mask;
                let m_z = (987654321 - s * 10000) & mask;
                return function() {
                    m_z = (36969 * (m_z & 65535) + (m_z >> 16)) & mask;
                    m_w = (18000 * (m_w & 65535) + (m_w >> 16)) & mask;
                    let result = ((m_z << 16) + m_w) & mask;
                    result /= 4294967296;
                    return result + 0.5;
                }
            }
        }

        function init() {
            state.polygons = [
                new Polygon([[0, 0], [canvas.width, 0], [canvas.width, canvas.height], [0, canvas.height]], 'base')
            ];
        }

        function isPointInPoly(pt, poly) {
            let x = pt[0], y = pt[1];
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i][0], yi = poly[i][1];
                let xj = poly[j][0], yj = poly[j][1];
                let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function sliceByAngledLine(polyPoints, xBase, my, angleDeg) {
            let left = [], right = [];
            const angleRad = angleDeg * Math.PI / 180;
            const tanA = Math.tan(angleRad);
            const getSide = (p) => {
                const lineX = xBase + (p[1] - my) * tanA;
                return p[0] - lineX;
            };

            for (let i = 0; i < polyPoints.length; i++) {
                let p1 = polyPoints[i];
                let p2 = polyPoints[(i + 1) % polyPoints.length];
                let side1 = getSide(p1);
                let side2 = getSide(p2);

                if (side1 < 0) left.push(p1);
                else right.push(p1);

                if ((side1 < 0 && side2 >= 0) || (side1 >= 0 && side2 < 0)) {
                    const dx = p2[0] - p1[0];
                    const dy = p2[1] - p1[1];
                    const t = (xBase - p1[0] + (p1[1] - my) * tanA) / (dx - dy * tanA);
                    left.push([p1[0] + t * dx, p1[1] + t * dy]);
                    right.push([p1[0] + t * dx, p1[1] + t * dy]);
                }
            }
            return [left, right];
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);

            const angleL = 30 + Math.random() * 15;
            const angleR = -(30 + Math.random() * 15);
            const xL = mx - state.impactWidth / 2;
            const xR = mx + state.impactWidth / 2;

            for (let i = state.polygons.length - 1; i >= 0; i--) {
                const target = state.polygons[i];
                if (isPointInPoly([mx, my], target.points)) {
                    let [p1, pRest] = sliceByAngledLine(target.points, xL, my, angleL);
                    if (p1.length > 2 && pRest.length > 2) {
                        let [centerQuad, p2] = sliceByAngledLine(pRest, xR, my, angleR);
                        if (centerQuad.length > 2) {
                            shatter(centerQuad, mx, my);
                            state.polygons.splice(i, 1);
                            if (p1.length > 2) state.polygons.push(new Polygon(p1, target.type));
                            if (p2.length > 2) state.polygons.push(new Polygon(p2, target.type));
                        } else shatter(target.points, mx, my, i);
                    } else shatter(target.points, mx, my, i);
                    break;
                }
            }
        });

        function shatter(points, mx, my, index = -1) {
            const newPolys = [];
            for (let i = 0; i < points.length; i++) {
                const p1 = points[i];
                const p2 = points[(i + 1) % points.length];
                const ratio = 0.2 + Math.random() * 0.6;
                const edgeX = p1[0] + (p2[0] - p1[0]) * ratio;
                const edgeY = p1[1] + (p2[1] - p1[1]) * ratio;

                // 碎裂块全部设为黑底，随机分配是否带故障线
                const type1 = Math.random() < 0.6 ? 'glitch' : 'black';
                const type2 = Math.random() < 0.3 ? 'glitch' : 'black';

                newPolys.push(new Polygon([p1, [edgeX, edgeY], [mx, my]], type1));
                newPolys.push(new Polygon([[edgeX, edgeY], p2, [mx, my]], type2));
            }

            if (index !== -1) state.polygons.splice(index, 1, ...newPolys);
            else state.polygons.push(...newPolys);
        }

        function render() {
            // 背景不再需要填充，多边形自己负责底色
            ctx.clearRect(0,0, canvas.width, canvas.height);
            state.polygons.forEach(p => p.draw());
            requestAnimationFrame(render);
        }

        init();
        render();
    </script>
</body>
</html>
